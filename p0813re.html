  --red: #a5342a;

}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}
body {

  color: var(--cream);
  font-family: 'Noto Serif TC', serif;
  font-weight: 300;
  -webkit-text-size-adjust: 100%;
  display: flex;
  flex-direction: column;
}

/* ── Top bar ── */
.topbar {
  flex-shrink: 0;
  padding: 8px 16px 8px;
  border-bottom: 1px solid var(--line);
}
.topbar-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
.toggle-btn {
  font-family: 'Noto Serif TC', serif;
  font-size: 12px;
  color: var(--mist);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 5px 10px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.toggle-btn.active { background: var(--gold); color: #fff; border-color: var(--gold); }
.toggle-btn:hover { border-color: var(--gold); }

/* ── Progress ── */
.progress-wrap {
  flex-shrink: 0;
  padding: 4px 20px 0;
}
.progress-text {
  text-align: center;
  font-size: 12px;
  color: var(--dim);
  letter-spacing: .15em;
}

/* ── Stage ── */
.stage {

  align-items: center;
  justify-content: center;
  padding: 8px 12px;
  min-height: 0;
  perspective: 1600px;
}
.flip-card {
  width: 100%;
  max-width: 640px;
  height: 100%;
  position: relative;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.4,0,.2,1);
}
.flip-card.flipped { transform: rotateY(180deg); }

.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  background: var(--card);
  border-radius: 18px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.face-front { }
.face-back { transform: rotateY(180deg); background: var(--card2); }

.face-tag-row {

.tf-answer-front {

  color: var(--darkred);
  margin-top: 14px;

.face-hint {

  font-size: 11px;

  gap: 10px;
  margin-bottom: 16px;
  flex-shrink: 0;
}
.answer-label {

  color: var(--dim);
  letter-spacing: .15em;
}
.answer-value {

  line-height: 1.9;
  flex: 1;
}
.explanation-text strong { color: var(--gold2); font-weight: 600; }

/* ── Controls ── */
.controls {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(14px + env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  pointer-events: none;

.ctrl-btn {

  border-radius: 50%;
  background: rgba(248,242,226,.85);
  backdrop-filter: blur(6px);
  border: 1.5px solid var(--line);
  color: var(--gold2);
  font-size: 19px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(138,90,8,.18);

  flex-shrink: 0;

.ctrl-btn:hover { transform: translateY(-2px); }
.ctrl-btn:active { transform: translateY(0); }
.ctrl-btn.disabled { opacity: .3; pointer-events: none; }
.ctrl-btn-flip {
  width: 56px; height: 56px;
  background: linear-gradient(135deg, #8a5a08, #b5891d);
  color: #fff;
  font-size: 22px;
}

.empty-state {
  text-align: center;
  padding: 40px 24px;
  color: var(--dim);
  font-size: 15px;
  line-height: 2;

<script id="qdata" type="application/json">[{"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "p0813精選．共37題", "qnum": "1", "question": "根本無明又稱為無始無明，是比較微細的煩惱，修行時應先破除根本無明，再破除枝末無明。（是/否）", "options": "", "answer": "否", "explanation": "惟覺安公老和尚開示「**修行先破枝末無明，枝末無明破了以後，再破根本無明**」。次第應為先枝末後根本，題目顛倒。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "p0813精選．共37題", "qnum": "2", "question": "無明染法以「作夢」為喻：忽然睡著就像無明，夢見種種事就像三細六麤。當人醒來時，夢境的一切就頓時消散。（是/否）", "options": "", "answer": "是", "explanation": "長水子璿《筆削記》以夢喻九相：「如有一人（真如），忽然睡著（無明），作夢（業相），見（轉相）種種事（現相）……忽然覺來，上事都遣。」**迷則九相宛然，覺則當下皆空**。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "p0813精選．共37題", "qnum": "3", "question": "所謂「隨染本覺」，是依染緣對治而顯現本覺作用；染法只是顯德之緣，並非本覺變為污染。（是/否）", "options": "", "answer": "是", "explanation": "「本覺隨染」不是本覺被染。染法只是**顯發本具德相之緣**，依染緣而顯現本覺之用，體性始終清淨不失。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "p0813精選．共37題", "qnum": "4", "question": "後三種染心屬於「不相應染」，是因為它們都是一念不覺所現起的微細妄相，此時尚未分出心王與心所的差別對待。（是/否）", "options": "", "answer": "是", "explanation": "後三種染心（現色、能見心、根本業不相應染）都只是**一念不覺所現起的微細心相**，這時候還沒有分出心王與心所的差別對待。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "p0813精選．共37題", "qnum": "5", "question": "二乘人雖已斷見思惑、證得人空，但因尚未了達根本無明，故對由無明所起的微細業識，仍無法真正了知。（是/否）", "options": "", "answer": "是", "explanation": "二乘雖斷見思、證人空，但因為**沒有了達根本無明**，對由無明所生起的微細業識，還是不能真正了知。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "p0813精選．共37題", "qnum": "6", "question": "「相似覺」之所以名為「相似」，是指二乘與初發意菩薩尚未親見真如，僅是比觀而知。（是/否）", "options": "", "answer": "是", "explanation": "相似覺意指二乘和三賢菩薩雖然理上通達，但還沒真正**親證真如**，只是「**相似**」於覺悟。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "p0813精選．共37題", "qnum": "7", "question": "「意識」是指第六識，又稱「分離識」或「分別事識」，它是依著「五住地無明（根本無明）」來起惑造業的。（是/否）", "options": "", "answer": "否", "explanation": "意識為第六識，亦名分離識、分別事識，是正確的。但第六意識是依著粗重的「**見愛等四住地煩惱**」來起惑造業；**五意才是總依根本無明**。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "p0813精選．共37題", "qnum": "8", "question": "六種染心，即意識及五種意。依因緣生起次第，從麤至細；辨治斷次第，從細向麤。（是/否）", "options": "", "answer": "否", "explanation": "順序講反了：講迷真起妄的次第是「**從細至麤**」（由業識到意識）；講對治斷惑的次第才是「**從麤向細**」（由執相應染斷到根本業不相應染）。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "p0813精選．共37題", "qnum": "9", "question": "在「水波四喻」中，「海水」被用來譬喻無明妄識，「風」被用來譬喻真心。（是/否）", "options": "", "answer": "否", "explanation": "波水四喻中，「**海水喻真心、風喻無明**、波喻業識等」。題目將海水配無明妄識、風配真心，正好顛倒。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "p0813精選．共37題", "qnum": "10", "question": "法身菩薩（地上菩薩）覺於念住，遠離了分別粗念，稱為「隨分覺」。（是/否）", "options": "", "answer": "是", "explanation": "法身菩薩（登地）已能覺察到極微細的「住相」，遠離了粗重的分別念頭，**分證法身、分證真如**，破一分住相即證一分法身，這階段稱為「**隨分覺**」。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "p0813精選．共37題", "qnum": "11", "question": "「現識」能現出一切境界，如鏡現色像，任運自然的生起，並且恆常在前，但它與第六、第七識一樣，有時是會間斷、或斷滅的。（是/否）", "options": "", "answer": "否", "explanation": "法藏大師云「任運而起者，非如六七識有時斷滅」，現識**常在諸法之先、恆常現前無間斷**，不像六識易斷、七識於滅盡定等亦不現行。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "p0813精選．共37題", "qnum": "12", "question": "「如實空鏡」所說「遠離一切境界相」，是指覺體本來寂靜湛然，超越一切對待。（是/否）", "options": "", "answer": "是", "explanation": "妄心妄境本就虛妄不實，而覺體**空無妄染、本來寂靜湛然**、超越一切對待。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "p0813精選．共37題", "qnum": "13", "question": "下列哪一種心理狀態最符合「相續相」的定義？", "options": "①突然看到一個外在的境界　②判斷眼前的境界是順境還是逆境　③對喜歡的境界生起樂受後，念念不忘，持續回想　④開口罵人，造下口業", "answer": "③", "explanation": "相續相「依於智故，生其苦樂，覺心起念，相應不斷」，**數數起念、相續不斷**。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "p0813精選．共37題", "qnum": "14", "question": "有關《大乘起信論》所說「心、意、意識」，下列何者正確？", "options": "①心、意、意識三者名稱不同，實際上皆指第六意識的作用　②心指攀緣六塵之意識，意指五意，意識指阿黎耶識　③心指阿黎耶自體心，意指依不覺而展轉生起之五意（業、轉、現、智、相續），意識則依意而起，攀緣六塵，執取我、我所　④心、意、意識三者各自獨立生起，彼此無相依關係", "answer": "③", "explanation": "心＝**阿黎耶自體心**（體）；意＝依不覺展轉生起的**五意**（業轉現智相續）；意識＝依意攀緣六塵、執取我所。**一層比一層粗**。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "p0813精選．共37題", "qnum": "15", "question": "「緣起之體、緣起之緣由、緣起之相」分別可對應：", "options": "①染心、真如、無明　②真如、無明、染心　③無明、染心、真如　④真如、染心、無明", "answer": "②", "explanation": "「緣起之體」＝**真如**（生滅所依的本體）；「緣起緣由」＝**無明**（不覺心動的緣由）；「緣起之相」＝**染心**（無明熏動真心後所現的生滅相狀）。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "p0813精選．共37題", "qnum": "16", "question": "下列敘述何者正確？", "options": "①「業識」的產生與阿黎耶識心體無關　②「現識」常在諸法之前，是因為此識是諸法之本，諸法所依　③「智識」不了前心所現之境，虛妄無實，創起慧數，分別染淨，是事識內粗分別　④「意識」能住持過去善惡業種，成熟現在未來苦樂果報", "answer": "②", "explanation": "現識像鏡子一樣**任運現境、恆常在前**，前六識都必須依它所現的境界才有東西可攀緣，所以是**諸法的根本**。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "p0813精選．共37題", "qnum": "17", "question": "對六種染心中執相應染的敘述何者正確？", "options": "①是六麤中執取相及計名字相　②由其執著心外有法，與境相應，染污自性，故云執相應染　③依二乘解脫，及信相應地遠離　④以上皆是", "answer": "④", "explanation": "執相應染就是六麤中的執取相、計名字相，因為**執著心外實有境界、與境相應而染污自性**，要到二乘無學位或初住（信相應地）才能遠離。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "p0813精選．共37題", "qnum": "18", "question": "關於覺滅相，下列何者錯誤？", "options": "①凡夫的吾日三省吾身　②覺知滅諦之寂滅相　③此仍是在生滅心中遏捺　④若約後六麤，當覺起業相", "answer": "②", "explanation": "覺滅相是凡夫在生滅心中**止惡防非**，還未達到阿羅漢出世間「**覺知滅諦**」的寂滅境界。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "p0813精選．共37題", "qnum": "19", "question": "《起信論》所謂「智礙」，以下敘述何者正確？", "options": "①依我執見思，能使流轉，障涅槃果，名煩惱障，是菩薩別障　②依法執等惑，迷所知境，障菩提果，名所知障，是二乘通障　③能起染心之無明，昏迷不覺，為智礙，亦名所知障，所知非障，障所知智境故　④以上皆是", "answer": "③", "explanation": "《起信論》的「智礙」指的是**無明本身昏迷不覺**，障礙了如實照見一切差別境界的自然業智，也就是唯識所說的「**所知障**」。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "p0813精選．共37題", "qnum": "20", "question": "關於眾生心念的「生滅相」，下列對於「前三染」的敘述何者正確？", "options": "①屬於「與心不相應」的細相　②在經典中被稱為「流注生滅」　③具有心王心所相隨、心境對立的特徵，相貌麤顯　④其體非常微細，像暗流般恆流不絕", "answer": "③", "explanation": "前三染（執相應、不斷相應、分別智相應染）屬「相應染」，心王心所相隨、能所對待明顯，相貌粗顯，稱為「**相生滅**」；後三染才是與心不相應的細相，稱為「**流注生滅**」。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "p0813精選．共37題", "qnum": "21", "question": "「迷人依方故迷」是比喻什麼道理？", "options": "①眾生依覺故迷，離覺則無不覺　②眾生因為方向感不好才輪迴　③迷失的人必須尋求諸佛指引　④真覺與不覺毫無關聯", "answer": "①", "explanation": "喻**眾生依覺故迷、離覺則無不覺**。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "p0813精選．共37題", "qnum": "22", "question": "有關覺「四相」，對應的修行位階，下列何者錯誤？", "options": "①覺異相——二乘、三賢菩薩　②覺住相——法身菩薩　③覺生相——菩薩地盡，滿足方便，一念相應　④覺滅相——初發意菩薩", "answer": "④", "explanation": "覺滅相對應「**十信外凡位**」之凡夫人，而不是初發意菩薩；初發意菩薩（三賢位）所對的是「**覺異相**」。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "p0813精選．共37題", "qnum": "23", "question": "關於六麤的生起與特性，下列何者正確？", "options": "①六麤能現起三細所對的境界　②六麤由微而著，是以三細所現的境界為緣而生，麤不離細　③六麤與三細各自獨立，互不相關　④六麤先於三細而生起", "answer": "②", "explanation": "煩惱是從微細（三細）發展到粗重（六麤），粗相是**依緣細境界而生，所以粗不離細**。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "p0813精選．共37題", "qnum": "24", "question": "《起信論》云：「一切分別，即分別自心」，究其原因以下何者正確？", "options": "①心外無法，一切法皆從心起妄念而生　②眾生都喜歡反思自己　③真如本身具備各種具象的相貌可供自心分別　④第六意識只能向內觀察，無法緣外境", "answer": "①", "explanation": "**心外無法**，境界其實就是自心妄念所現，離心無境可分別，所以說「分別即分別自心」。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "p0813精選．共37題", "qnum": "25", "question": "依據圓瑛法師解釋，破除和合識內一分不覺之相，根本無明窮盡，顯現「法身本覺義」，此乃哪一種果德的究竟？", "options": "①智果　②斷果　③覺果　④業果", "answer": "②", "explanation": "破除無明煩惱而顯現法身，屬於斷除煩惱障礙的「**斷果**」究竟。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "p0813精選．共37題", "qnum": "26", "question": "「忽然念起，名為無明」，此處的「忽然」是什麼意思？", "options": "①無明有明確的開始時間　②無明有真實自體　③無明沒有真實根源，只是一念迷妄　④無明只在凡夫身上有，菩薩完全沒有", "answer": "③", "explanation": "「忽然」不是指有一個明確的開始時間點，而是說**無明的生起找不到真實的根源**，純粹是迷真起妄的一念而已。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "p0813精選．共37題", "qnum": "27", "question": "諸佛菩薩利益眾生功德之相常無斷絕，其運作機制為何？", "options": "①刻意觀察眾生業力來決定是否幫助　②隨順眾生根性，不假造作自然感應而現　③需依靠眾生不斷地供養才能持續　④需要無明妄識的推動", "answer": "②", "explanation": "佛菩薩度眾生是**隨順眾生根機自然感應**，像鏡子映物一樣任運自然，不是刻意造作。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "p0813精選．共37題", "qnum": "28", "question": "為什麼「如實空鏡」會強調「非覺照義」？", "options": "①因為覺性的力量太弱無法覺照　②因為修行階段還沒到，所以不能覺照　③因為妄念太強烈阻擋了覺照　④因為妄體本來就沒有（如兔角），不需要靠觀智覺照才讓它消失", "answer": "④", "explanation": "因為虛妄境界**本來沒有實體**（如兔角本空），不需要刻意用觀智去覺照才能讓它消失。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "p0813精選．共37題", "qnum": "29", "question": "有關法體離障，顯性德——淳淨明，下列何者錯誤？", "options": "①「淳淨明」是修行後新生之清淨功德，原本並不具足　②破除無明覆蓋，智慧光明現前，故名「明」　③滅除麤細染心，故名「淨」　④離開真妄和合的雜相，故名「淳」", "answer": "①", "explanation": "「淳淨明」是**真心本具的性德**，因去除無明障礙而顯現，不是修行後才新生的。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "p0813精選．共37題", "qnum": "30", "question": "下列何者最能說明「智淨相」？", "options": "①真如本體本來清淨　②依始覺智破無明，還顯本覺清淨　③佛果之神通妙用　④內熏之因", "answer": "②", "explanation": "智淨相就是依靠**始覺智慧破除無明**，讓本來清淨的本覺（真如）重新顯露出來。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "p0813精選．共37題", "qnum": "31", "question": "關於「根本業不相應染」與「無明」治斷的時序，下列敘述何者正確？", "options": "①業識滅與無明惑盡，然兩者治斷並非一時　②無明先斷，隨後業識才在如來地滅除　③業識滅時，無明即斷，無明盡時，識不和合，同在如來地盡　④業識在十地滿心斷，無明則要到佛果地才斷", "answer": "③", "explanation": "根本無明是迷、業識是因無明而起的最初妄動，**業識滅、無明也跟著斷，兩者同時在如來地究竟斷盡**，沒有誰先誰後。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "p0813精選．共37題", "qnum": "32", "question": "心生滅相有麤、細二種，以下敘述何者正確？", "options": "①此二種生滅，皆依枝末無明熏習真如，動起三細，轉起麤心　②就六染言，前三相應染細，後三不相應染麤　③根本業不相應染，乃細中之細，佛果上能離，故云唯佛能知　④以上皆是", "answer": "③", "explanation": "①錯在說是「枝末無明」，其實是「**根本無明**」；②錯把相應染、不相應染的麤細講反了；③正確：**根本不相應染最細，只有佛果位才能究竟遠離**。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "p0813精選．共37題", "qnum": "33", "question": "關於「無明業相」的內涵，下列敘述何者正確？", "options": "①這裡的「業」是指眾生發動身口所造作的善惡業，與六麤中的「起業相」意義完全相同　②這裡的「業」具有「動作」與「為因」兩層意義，指的是最初一念不覺使淨心生微動，且此動念為未來無邊生死苦患的起因　③在「無明業相」產生的階段，心念已經可以清楚地分辨「能見」與「所見」　④諸佛菩薩隨緣度化眾生的「本覺不思議業相」，其本質與「無明業相」是相同的，皆是因妄動而生", "answer": "②", "explanation": "圓瑛法師業有二義：**動作義**（最初一念不覺動彼淨心）、**為因義**（動則有苦、為生死苦患之因）。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "p0813精選．共37題", "qnum": "34", "question": "有關「本覺」體用，下列何者正確？", "options": "①法出離鏡屬於「因隱」　②緣熏習鏡屬於「修顯」　③如實空鏡與因熏習鏡屬於「果顯」　④智淨相、不思議業相屬於「修顯」", "answer": "④", "explanation": "智淨相、不思議業相由始覺修證而顯，屬「**修顯**」；四鏡屬性淨本有（法出離鏡屬**果顯出纏**、緣熏習鏡屬**果顯**、如實空鏡與因熏習鏡屬**因隱在纏**）。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "p0813精選．共37題", "qnum": "35", "question": "關於三細相產生的時間先後，下列何者正確？", "options": "①先有業相，過了很久才有轉相　②境界相最先產生　③祇是一剎那心，實無前後次第　④必須經歷三大阿僧祇劫才能形成", "answer": "③", "explanation": "寶靜大師「此三相**祇是一剎那心，實無前後次第**」。三細俱時而起、本無先後。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "p0813精選．共37題", "qnum": "36", "question": "關於染淨同異之相，以下何者正確？", "options": "①為何要辨明染淨同異之相，是因為依如來藏有生滅心，今既明生滅心，進一步明生滅即不生滅，真如生滅二門不相離　②同相者，即異而同：「覺」有「不思議業相」，「不覺」有「無明業力」，染淨二業皆非實有，名為「業幻」，皆同真如性相　③異相者，即同而異，二種幻差別的相用顯現各異：「無漏法」順平等性，由於對治染法而「隨染幻差別」；「無明」違平等性，本身自是差別，為「性染幻差別」　④以上皆是", "answer": "④", "explanation": "①辨明染淨同異之緣由、②同相即異而同（業幻皆同真如性相）、③異相即同而異（無漏隨染、無明性染）三敘俱合論文。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "p0813精選．共37題", "qnum": "37", "question": "以「貪吃」為例，下列何者最符合「不覺、始覺、本覺」之義？", "options": "①看到喜歡的食物立刻忍住不吃，使心空白即回到本覺　②面對食物起貪念時，順著欲望去吃是不覺；能當下覺察而不隨之轉是始覺；知貪念空無自性、心本不染是本覺　③貪念生起時加以壓制使其完全不起即是始覺，久而久之成本覺　④只有完全沒有食慾才是回到本覺", "answer": "②", "explanation": "順著欲望去吃是**不覺**；能當下覺察並克制貪念是**始覺**；知道貪念本來空無自性是**本覺**。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題（原題庫）", "qnum": "38", "question": "下列敘述何者錯誤？", "options": "①鵝王擇乳是譬喻菩薩修行達到十地滿心，方能遠離最微細的生相無明　②六即中分證即，對應「覺住相」，破住相無明，無明分分破，真如分分現　③覺察到微細動念初生時，了知初相即無念，是因為確實有初相無明，只是不覺而已　④四相流轉猶如睡夢，當大覺時，方知唯一淨心，四相了不可得，無有體性可辨前後", "answer": "③", "explanation": "「確實有初相無明」是錯的。覺悟後會發現初相**本無自性、了不可得**（無念），並非有一個真實的初相。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題（原題庫）", "qnum": "39", "question": "本覺隨染分別而生「智淨相」與「不思議業相」二種相，此二相與本覺不相捨離，因為用不離體。（是/否）", "options": "", "answer": "是", "explanation": "這兩種相都是本覺清淨體性發揮的清淨作用，既然是作用就離不開本體，所以**不相捨離**。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題（原題庫）", "qnum": "40", "question": "染心義者，名為煩惱礙，能障世間自然業智；無明義者，名為智礙，能障真如根本智。（是/否）", "options": "", "answer": "否", "explanation": "講義原文是「染心義者，名為**煩惱礙，能障真如根本智**」、「無明義者，名為**智礙，能障世間自然業智**」，題目把兩者所障礙的對象講反了。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題（原題庫）", "qnum": "41", "question": "⚠️ 《起信論》「同相」說「皆同真如性相」。所謂「性同」是從諸法的角度說，諸法同以真如為體；「相同」是從真如的角度說，真如亦以諸法為相。（是/否）", "options": "", "answer": "是", "explanation": "染淨諸法的本體都是真如（**性同**）；而真如也透過這些諸法來顯現其相（**相同**）。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題（原題庫）", "qnum": "42", "question": "關於「異相」，無漏法（淨法）是順應平等性、為對治染法而「隨染幻差別」；而無明（染法）則違背平等性，本性自然就是差別的，稱為「性染幻差別」。（是/否）", "options": "", "answer": "是", "explanation": "無漏法順平等性、為對治染法而「隨染幻差別」；無明違平等性、迷之本身自成差別而「**性染幻差別**」。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題（原題庫）", "qnum": "43", "question": "在生滅因緣中，產生「智識、相續識等事識」的因與緣分別是什麼？", "options": "①阿梨耶心體為因，根本無明為緣　②梨耶返熏無明為因，境風吹動識浪為緣　③智識為因，相續識為緣　④見愛煩惱為因，客觀境界為緣", "answer": "②", "explanation": "三細形成後，**梨耶返熏無明使無明增長（因）＋境風吹動識浪（緣）**，才生出智識、相續識等六麤。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題（原題庫）", "qnum": "44", "question": "眾生生死流轉的生滅現象，完全是依據「心」、「意」、「意識」的輾轉演變而產生的。其中「心」是指阿黎耶識心體，並非起惑造業、向外攀緣的第六意識。（是/否）", "options": "", "answer": "是", "explanation": "生滅流轉是依**阿賴耶識（心）**生起微細識流（意），再發展出向外攀緣的（意識）而產生的。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題（原題庫）", "qnum": "45", "question": "六麤中的「相續相」，不僅代表內心對苦樂感受念念不斷，它更能「起惑潤業，引持生死」，是推動輪迴相續的關鍵動力。（是/否）", "options": "", "answer": "是", "explanation": "憨山大師「數數起念，相續不斷，**起惑潤業，引持生死**相續不斷，故名相續相」。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題（原題庫）", "qnum": "46", "question": "菩薩在第九地「心自在地」能遠離下列哪一種微細染心？", "options": "①能見心不相應染　②不斷相應染　③執相應染　④現色不相應染", "answer": "①", "explanation": "能見心不相應染對應五意中的「**轉識**」、三細中的「**能見相**」，要到第九地「**心自在地**」才能遠離。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題（原題庫）", "qnum": "47", "question": "馬鳴菩薩於《大乘起信論》中，循循善誘從「三細六粗」、「五意」、「六染」等方面說明無明煩惱生起的過程，目的在鍛鍊眾生的邏輯推理能力，因為邏輯推理能力是成佛的不二法門。（是/否）", "options": "", "answer": "否", "explanation": "馬鳴菩薩說明的用意，是要幫助眾生**看清煩惱如何生起，進而觀照返妄歸真、對治無明**，不是為了訓練邏輯推理能力。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題（原題庫）", "qnum": "48", "question": "「不染而染」是指真如本來清淨，卻能隨無明之緣而現起染法。（是/否）", "options": "", "answer": "是", "explanation": "「不染而染」正是指真如本來清淨不變，卻能隨著無明的緣，現起種種染污之相。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題（原題庫）", "qnum": "49", "question": "「所謂心性常無念故，名為不變。既是不變，因何而有無明。」以下敘述何者正確？", "options": "①不如實知真如法一故，與真如相背，故有無明　②真如本來離念，此則無端起念，即獨頭生相，根本不覺，名為無明　③無明為染法之源，最極微細，無別有法能始乎此，亦名無始無明　④以上皆是", "answer": "④", "explanation": "三句話分別回答「為何會有無明」，三個說法都對，合起來就是完整答案。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "單元16．來自0807統合筆記", "qnum": "50", "question": "關於「麤中之麤，凡夫境界。麤中之細及細中之麤，菩薩境界。細中之細，是佛境界。」下列何者正確？", "options": "①禪七期間坐到好香，此為麤中之細的境界　②不斷相應染，分別智相應染，乃細中之麤　③粗與細的差別，是由於去妄的程度不同而有，非這念心實有粗細之相　④念佛達到一心不亂，此為細中之麤的境界", "answer": "③", "explanation": "**粗細只是依斷惑深淺所立的假名方便**，這念心本身並沒有一個固定不變的粗相或細相。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "單元16．來自0807統合筆記", "qnum": "51", "question": "「麤中之麤，凡夫境界」，以下敘述何者正確？", "options": "①一不如意，就瞋心大作　②靜坐時妄想、昏沉不斷　③仔細盤算，算計他人　④以上皆是", "answer": "④", "explanation": "一不如意就瞋心大作、靜坐時妄想昏沉不斷、仔細盤算計較他人，這些都是凡夫最容易察覺、**最粗重的煩惱現行**，正是「麤中之麤，凡夫境界」的寫照。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題（原題庫）", "qnum": "52", "question": "六麤相中的「起業相」僅單純指心理上的起心動念，尚未發動到身體與口頭的實際造作。（是/否）", "options": "", "answer": "否", "explanation": "「起業相」是指**已經發動到身體和語言去實際造作種種善惡業**了，不只是心中動念。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13．五意與意識個別定義", "qnum": "53", "question": "「現識」所現境界，是離開心體之外，真實存在的外境。（是/否）", "options": "", "answer": "否", "explanation": "現識所現的境界，如同**病眼妄見空華**，是妄心所現的妄境，並非心外真實獨立存在的外境。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13．五意與意識個別定義", "qnum": "54", "question": "「業識」的生起，是因為根本無明業力，導致本覺真心不覺而產生妄動所形成的。（是/否）", "options": "", "answer": "是", "explanation": "業識就是本覺真心被**根本無明業力熏動**，產生了一念不覺的微細妄動。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13．五意與意識個別定義", "qnum": "55", "question": "「五意」是指業識、轉識、現識、智識、相續識，前三意是三細，在事識中，後二意是六麤前二，也在事識中。（是/否）", "options": "", "answer": "否", "explanation": "前三意（業、轉、現）是三細，屬**本識**（黎耶識），非在事識中；後二意（智識、相續識）方為六麤前二，屬**事識中之微細分別**。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13．五意與意識個別定義", "qnum": "56", "question": "「智識」的作用，是開始對境界相產生微細的分別心，去分辨境界的染污與清淨。（是/否）", "options": "", "answer": "是", "explanation": "智識的作用就是開始對現識所現的境界，產生**染淨、好壞等微細的分別心**。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13．五意與意識個別定義", "qnum": "57", "question": "哪一種識能夠讓「現在已經之事，忽然而念，未來之事，不覺妄慮」？", "options": "①轉識　②智識　③現識　④相續識", "answer": "④", "explanation": "這是「**相續識**」的作用，會讓心念不斷延續，從而回憶過去已經發生的事，或擔憂未來的事。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13．五意與意識個別定義", "qnum": "58", "question": "有關「意識」，下列何者正確？", "options": "①以意為根，乃意所發之識　②又稱「分離識」，外依五根取境，背覺合塵，與真心本體相背離　③能緣過去、現在、未來三世之境，及內根外塵種種事相而起分別認識，又稱「分別事識」　④以上皆是", "answer": "④", "explanation": "意識同時是「**意所發之識**」、「**分離識**」（依五根攀緣、背覺合塵）、「**分別事識**」（緣三世內外事相分別），三種說法都對。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13．五意與意識個別定義", "qnum": "59", "question": "依五意流轉次第，下列何者正確？", "options": "①業識（分別境）→轉識（能見）→現識（動心）→智識（念相應不斷）→相續識（執取境）　②業識（能見）→轉識（動心）→現識（執取境）→智識（念相應不斷）→相續識（分別境）　③業識（動心）→轉識（能見）→現識（境界）→智識（分別境）→相續識（念相應不斷）　④業識（執取境）→轉識（分別境）→現識（能見）→智識（動心）→相續識（現境）", "answer": "③", "explanation": "五意順序是：**業識(動心)→轉識(能見)→現識(境界)→智識(分別境)→相續識(念相應不斷)**。"}]</script>
<script>

function qid(item) { return item.unitCn + '-Q' + item.qnum; }

let deck = [];

let starOnlyOn = false;

function buildDeck() {
  let base = ALL.slice();
  if (starOnlyOn) {
    base = base.filter(i => bookmarks.has(qid(i)));
  }
  deck = base;
  order = deck.map((_, i) => i);
  shuffleArray(order);
  pos = 0;
  flipped = false;
  render();
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function current() {
  if (deck.length === 0) return null;
  return deck[order[pos]];
}

function render() {
  const stage = document.getElementById('stage');
  const card = document.getElementById('flipCard');
  const item = current();

  if (!item) {
    stage.innerHTML = '<div class="empty-state">這個篩選條件下沒有題目。<br>' +
      (starOnlyOn ? '你還沒有加星號的題目喔，先去「全部單元」點幾個 ★ 吧。' : '') + '</div>';
    document.getElementById('progressText').textContent = '0 / 0';
    document.getElementById('prevBtn').classList.add('disabled');
    document.getElementById('nextBtn').classList.add('disabled');
    return;
  }

  card.classList.toggle('flipped', flipped);

  const tag = item.unit + '・' + item.unitMeta.split('，')[0];
  document.getElementById('tagFront').textContent = tag;
  document.getElementById('tagBack').textContent = tag;
  document.getElementById('qnumFront').textContent = 'Q' + item.qnum;
  document.getElementById('questionText').textContent = item.question;
  document.getElementById('optionsText').innerHTML = item.options ? highlightCorrectOption(item.options, item.answer) : '';
  document.getElementById('optionsText').style.display = item.options ? 'block' : 'none';

  const tfFront = document.getElementById('tfAnswerFront');
  if (!item.options && (item.answer === '是' || item.answer === '否')) {
    tfFront.textContent = '正確答案：' + item.answer;
    tfFront.style.display = 'block';
  } else {
    tfFront.textContent = '';
    tfFront.style.display = 'none';
  }

  document.getElementById('explanationText').innerHTML = mdBold(item.explanation);

  const isStar = bookmarks.has(qid(item));
  document.getElementById('starFront').textContent = isStar ? '★' : '☆';
  document.getElementById('starFront').classList.toggle('on', isStar);
  document.getElementById('starBack').textContent = isStar ? '★' : '☆';
  document.getElementById('starBack').classList.toggle('on', isStar);

  document.getElementById('progressText').textContent = (pos + 1) + ' / ' + deck.length;
  document.getElementById('prevBtn').classList.toggle('disabled', pos === 0);
  document.getElementById('nextBtn').classList.toggle('disabled', pos === deck.length - 1);

  saveState();
}

function escapeHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
function highlightCorrectOption(optionsStr, answer) {
  const ans = (answer || '').trim();
  if (!CIRCLED.includes(ans)) return escapeHtml(optionsStr);
  const parts = optionsStr.split(new RegExp('(?=[' + CIRCLED.join('') + '])'));
  return parts.map(p => {
    return p.charAt(0) === ans ? '<span class="opt-correct">' + escapeHtml(p) + '</span>' : escapeHtml(p);
  }).join('');
}

function mdBold(s) {
  return (s || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function handleCardClick(e) {
  flipCard();
}
function flipCard() {
  if (!current()) return;
  flipped = !flipped;
  document.getElementById('flipCard').classList.toggle('flipped', flipped);
}
function goNext() {
  if (pos < deck.length - 1) { pos++; flipped = false; render(); }
}
function goPrev() {
  if (pos > 0) { pos--; flipped = false; render(); }
}
function toggleStar(e) {
  e.stopPropagation();
  const item = current();
  if (!item) return;
  const id = qid(item);
  if (bookmarks.has(id)) bookmarks.delete(id);
  else bookmarks.add(id);
  saveBookmarks(bookmarks);
  render();
}
function updateToggleButtons() {
  document.getElementById('shuffleBtn').classList.toggle('active', true);
  document.getElementById('allBtn').classList.toggle('active', !starOnlyOn);
  document.getElementById('starOnlyBtn').classList.toggle('active', starOnlyOn);
}
function toggleShuffle() {
  // 已鎖定為隨機模式，點擊即重新洗牌
  order = deck.map((_, i) => i);
  shuffleArray(order);
  pos = 0; flipped = false;
  render();
}
function setFilter(mode) {
  starOnlyOn = (mode === 'star');
  updateToggleButtons();
  buildDeck();
}
function saveState() {
  const item = current();
  if (!item) return;
  localStorage.setItem(STATE_KEY, JSON.stringify({
    starOnlyOn, qid: qid(item)
  }));
}
function restoreState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null');
    if (s) starOnlyOn = !!s.starOnlyOn;
  } catch(e) {}
  updateToggleButtons();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); flipCard(); }
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  else if (e.key.toLowerCase() === 's') toggleStar(e);
});

restoreState();
buildDeck();
</script>
</body>
</html>
