<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>傾聽達賴喇嘛・語錄卡片</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3ecdd;--card:#fbf6ea;--ink:#2a2521;--sub:#6b5a43;--gold:#8b5a14;--red:#a8433a;--line:#d9c9a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-size:18px;line-height:1.85;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.wrap{position:relative;max-width:480px;margin:0 auto;padding:8px max(10px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.top{position:sticky;top:0;z-index:5;background:var(--paper);padding:6px 0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;font:inherit;font-size:16px;padding:3px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--sub);cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
#stage{margin-top:8px;perspective:800px}
.card{background:var(--card);border:2px solid var(--line);border-top:6px solid var(--gold);border-radius:18px;padding:0 16px 22px;min-height:calc(100vh - 300px);min-height:calc(100dvh - 300px);display:flex;flex-direction:column;box-shadow:0 2px 0 var(--line);transition:opacity .22s,transform .22s}
.card.out{opacity:0;transform:translateX(var(--dx,24px))}
.strip{display:block;width:calc(100% + 32px);margin:0 -16px;height:28px}
.ico{display:block;width:200px;max-width:62%;height:auto;margin:2px auto 0}
.lab{text-align:center;margin:2px 0 10px;color:var(--sub);font-size:15px}
.lab b{display:inline-block;min-width:30px;padding:0 8px;margin-right:6px;border:2px solid var(--red);color:var(--red);border-radius:8px;font-weight:700;line-height:1.6}
.card h3{margin:6px 0 12px;font-size:clamp(22px,6.4vw,27px);line-height:1.5;color:var(--red);font-weight:900;text-align:center}
.card h3::before{content:"「";color:var(--gold)}.card h3::after{content:"」";color:var(--gold)}
.card p{margin:0;font-size:clamp(18px,5.4vw,21px);text-align:justify;flex:1}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}.tag{font:inherit;font-size:16px;color:var(--red);background:#f3e6cf;border:1.5px solid var(--line);border-radius:999px;padding:1px 14px;cursor:pointer}#fb{display:none;text-align:center;font-size:16px;color:var(--sub);margin-top:8px}#fb b{color:var(--red)}#fb button{font:inherit;font-size:15px;margin-left:8px;color:var(--red);background:none;border:1.5px solid var(--red);border-radius:999px;padding:0 12px;cursor:pointer}
.cover{text-align:center;justify-content:center}
.cover svg.hero-art{width:calc(100% + 32px);margin:0 -16px;height:auto}
.cover h1{margin:10px 0 0;font-size:clamp(28px,8.4vw,34px);color:var(--gold);font-weight:900;letter-spacing:.08em}
.cover p{margin:6px 0 0;color:var(--sub);font-size:18px;flex:none;text-align:center}
.cover .hint{margin-top:14px;font-size:16px;color:var(--sub)}
.end{text-align:center;justify-content:center}
.end svg.elder{width:150px;margin:6px auto}
.end p{flex:none;text-align:center;font-size:18px;color:var(--sub)}
.nav{display:flex;align-items:center;gap:10px;margin-top:10px;position:sticky;bottom:0;background:var(--paper);padding:8px 0 calc(6px + env(safe-area-inset-bottom));z-index:4}
.nav>button{flex:none;width:60px;height:54px;font:inherit;font-size:26px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--gold);cursor:pointer}
.mid{flex:1;text-align:center;font-size:16px;color:var(--sub)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
.rnd{background:none;border:none;font:inherit;font-size:15px;color:var(--red);cursor:pointer;margin-top:4px}
#icons,#ph{display:none}

<div class="top"><div class="chips" id="chips"><button class="chip" data-c="0">序　內在和平與普世責任</button><button class="chip" data-c="1">一　慈悲與利他</button><button class="chip" data-c="2">二　和平與非暴力</button><button class="chip" data-c="3">三　普世價值與責任</button><button class="chip" data-c="4">四　修心、忍辱與情緒調伏</button><button class="chip" data-c="5">五　佛法與教義</button><button class="chip" data-c="6">六　生活的智慧</button><button class="chip" data-c="7">七　超越宗教</button><button class="chip" data-c="8">八　教育、倫理與心靈財富</button><button class="chip" data-c="9">九　死無常與生命的意義</button><button class="chip" data-c="10">十　知足、平靜與快樂泉源</button><button class="chip" data-c="11">十一　環境保護與文化遺產</button><button class="chip" data-c="12">十二　科學與佛學的對話</button></div></div>
<div id="fb"></div><div id="stage"></div>
<div class="nav"><button id="pv" aria-label="上一張">‹</button><div class="mid"><span id="pos"></span><div class="bar"><i id="pb"></i></div><button class="rnd" id="rn">隨機一張</button></div><button id="nx" aria-label="下一張">›</button></div>

var D={"deck": [{"c": 0, "h": "回應時代動盪", "b": "現代世界面臨貧困、衝突與不安；若忽略內心世界、不先與自己和平相處，便不可能獲得真正的世界和平。", "t": ["和平"]}, {"c": 0, "h": "解除內心的武裝", "b": "想要推動外在的和平與去武裝化，前提必須先解除內心的仇恨與偏見；唯有透過慈悲與關愛，才能從根本化解矛盾。", "t": ["慈悲", "和平"]}, {"c": 0, "h": "非宗教專利，而是共存必需品", "b": "慈悲與仁善並非特定宗教的專屬，而是人生的哲理與人類共存必備的條件；無論是否具備宗教信仰，具足慈悲心都是對人性本質的喚醒。", "t": ["宗教", "慈悲"]}, {"c": 0, "h": "自利與利他的圓融", "b": "真正的慈悲並非盲目犧牲個人利益，愛自己是愛他人的基石；體認到他人同樣擁有追求快樂的權利，會油然生起責任感，從而增強自信、減輕內心的恐懼與不安。", "t": ["利他", "慈悲", "愛自己"]}, {"c": 0, "h": "非暴力與對話", "b": "真正的力量來自助人之心與和解的精神；非暴力並非懦弱，而是源於內心的自信與勇氣；透過設身處地的對話與傾聽，才能建構人與人之間的信任。", "t": ["非暴力", "對話", "自信"]}, {"c": 0, "h": "由個人到社會的擴散", "b": "世界和平並非遙不可及的夢想。只要個人先建立內心的平和，進而影響家庭與周遭朋友，由一個家庭擴散至成百上千個家庭，就能逐漸改變動盪的世界。", "t": ["家庭", "和平", "平靜"]}, {"c": 0, "h": "地球大家庭的共同命運", "b": "人類是一體，地球是大家共同的家園。我們做任何事都不應局限於狹隘的個人或局部利益，而應以全人類與所有眾生的福祉為目標。", "t": ["家庭"]}, {"c": 1, "h": "智慧與慈愛並重", "b": "真正的慈悲不僅是同理心，而是致力於眾生離苦得樂的利他主義，必須同時具足智慧與慈愛。若僅有熱情而無智慧相伴，可能反應過度而陷入不安；利他的慈悲必須始終與智慧相伴，才能將內在的熱誠轉化為切實有效的利他行動。", "t": ["智慧", "利他", "慈悲"]}, {"c": 1, "h": "非被動的同理心", "b": "慈悲是一種希望所有眾生隨時離苦得樂的願望與心態，它絕非被動的同理心，而是致力於使眾生解脫苦難的積極利他主義。", "t": ["慈悲", "利他"]}, {"c": 1, "h": "從誠心願望到承擔責任", "b": "僅有誠心的願望是不夠的，我們必須主動承擔責任，透過培養本身的利他行為來啟發他人向善。", "t": ["責任", "利他"]}, {"c": 1, "h": "能量與仁善的活泉", "b": "慈悲心就像一座溢流的水庫，源源不絕地提供內在的能量、決心與仁善。", "t": ["慈悲"]}, {"c": 1, "h": "愛自己是愛他人的基礎", "b": "慈悲並非全然罔顧或犧牲個人利益。有些人誤以為如此，但「愛自己其實非常重要」——若我們連自己都不愛，又如何能真正去愛與關懷他人？只有學會愛自己、尊重自己，才能真正去愛與關懷他人。", "t": ["愛自己", "慈悲"]}, {"c": 1, "h": "自利與利他並不衝突", "b": "對他人的慈愛絕非忽略自我；培養利他的慈悲心，反而能讓自己獲得最大的快樂與心安。", "t": ["利他", "慈悲", "快樂"]}, {"c": 1, "h": "無偏見的關懷", "b": "一般人對親友的親密情感往往夾雜著依戀與執著；若只對親友親切卻對陌生人或敵人冷漠，這只是偏頗的慈悲。真正的慈悲是沒有偏見的，不會因對方的傷害或敵對態度而有所改變。", "t": ["慈悲", "敵人"]}, {"c": 1, "h": "對仇敵生起悲憫", "b": "對沒有依怙的弱者生起悲憫固然重要，但最難能可貴的是對傷害自己的仇敵依然生起悲憫心。", "t": ["慈悲與利他"]}, {"c": 1, "h": "區分「行為」與「個人」", "b": "展現慈悲並不代表接受不義之事、姑息錯誤行為或放棄原則；我們應當採取必要的對抗與反對措施，但同時寬恕做出該行為的人，並以仁慈的態度對待他們。", "t": ["慈悲", "寬恕"]}, {"c": 1, "h": "菩提心：一切利樂與除障的根本", "b": "面對逆緣或傷害時，觀修「愛他人勝過愛自己」的菩提心是最根本的除障方式。珍惜並愛護對方勝過於愛己，並將善業迴向給傷害自己的人，不僅能使對方無法造成損害、化解衝突，更能快速累積功德，成辦一切順緣、去除一切逆緣，使道地功德快速增長，是一切利樂的根本所在。", "t": ["菩提心", "愛自己"]}, {"c": 1, "h": "消除恐懼的解毒劑", "b": "當我們意識到他人與自己一樣擁有追求快樂的權利時，責任感便會油然生起。這種慈悲動機會轉化為強大的自信，從而減輕內心的恐懼與不安。", "t": ["慈悲", "快樂", "自信"]}, {"c": 1, "h": "萌發美德的種子", "b": "利他主義如同一顆種子，只要悉心培育，就能萌發出寬容、忍辱、毅力，以及面對困境、克服困難的勇氣。", "t": ["利他", "忍辱"]}, {"c": 1, "h": "促進身心健康", "b": "具有慈悲的態度能讓心靈獲得完全的輕鬆自在，對身體健康亦有極大益處。", "t": ["慈悲"]}, {"c": 1, "h": "人類共存的必需品", "b": "慈悲並非宗教的專利或奢侈品，而是人生的實踐哲理，是人心安定、和平以及人類共存必備的條件。其本質雖然溫和，卻蘊含著強大而穩固的力量。", "t": ["慈悲", "和平", "宗教"]}, {"c": 1, "h": "落實在日常行動中", "b": "慈悲不是高深的宗教理論。我們必須在日常生活中切實去幫助他人；即使能力有限無法助人，至少也要斷除害人之心。", "t": ["慈悲", "宗教"]}, {"c": 1, "h": "非暴力的力量", "b": "以愛與持續一致的慈悲待人，即使面對充滿怨恨的人，持之以恆且不鬆懈的愛與慈悲，終能感化對方。人類的雙手是用來擁抱的，而不是用來攻擊他人。", "t": ["非暴力", "慈悲"]}, {"c": 1, "h": "全球七十億人的大家庭", "b": "人類是一體，地球是我們唯一的家。我們做任何事情都不應局限於個人或狹隘的利益，而應將全世界 70 億人口視為一個大家庭，承擔起普世責任感。", "t": ["家庭", "普世責任", "責任"]}, {"c": 1, "h": "解除內心武裝與真誠對話", "b": "非暴力意味著帶著和解精神進行對話、傾聽與尊重對方。真正的世界和平無法單靠外在軍備解決，必須先從解除內心的武裝、建立個人內心的平和開始。", "t": ["對話", "非暴力", "和平"]}, {"c": 2, "h": "內在去武裝化：世界和平的根本前提", "b": "如果忽略內心世界，不先跟自己和平相處，人類便不可能獲得真正的世界和平。想要推動外在社會或國際間的解除武裝，前提必須先解除個人的內心武裝；而消除內心武裝的根本，在於加強慈悲與關愛。", "t": ["和平", "慈悲"]}, {"c": 2, "h": "和平的連鎖擴散", "b": "推動和平並非遙不可及的夢想，而是從個人建立內心和平開始，進而影響周遭家人與朋友；由一個家庭影響到一百個家庭，再擴散至一千個家庭，循序漸進地改變整個亂世。", "t": ["和平", "家庭"]}, {"c": 2, "h": "非暴力取決於動機，而非外相", "b": "暴力與非暴力的分界不在於表面的行為，而是在於內心的動機。", "t": ["非暴力", "動機"]}, {"c": 2, "h": "辨析偽善與真慈悲", "b": "若心懷惡念或瞋恨，卻堆著笑臉試圖欺騙對方，這種行為本質上就是暴力；反之，若出於慈悲與關切而責罵對方，並不算是暴力。", "t": ["慈悲"]}, {"c": 2, "h": "勇氣與自信的展現", "b": "非暴力絕非軟弱投降或懦弱順從的表徵，而是充滿自信與勇氣的展現。展現慈悲並不代表要接受不義之事，而是要以非暴力的方式起而對抗。", "t": ["自信", "非暴力", "慈悲"]}, {"c": 2, "h": "以對話取代對抗", "b": "面對問題時應採用「無害的方法」（無害行）來解決，這種方法就是對話。非暴力意味著對話，代表傾聽他人意見、尊重他人權利，並帶著和解的精神進行協調。", "t": ["對話", "非暴力"]}, {"c": 2, "h": "感受他人苦難的勇氣", "b": "透過對話達成和平需要極大的勇氣——一種將對方的利益與難處當作自己責任的勇氣，並能設身處地感受對方的痛苦。", "t": ["對話", "和平", "責任"]}, {"c": 2, "h": "語言的正面建構", "b": "人類創造優美的語言，是用來建構信任等正面力量，而非用來爭吵，或引發更多疑慮與不信任的痛苦。", "t": ["和平與非暴力"]}, {"c": 2, "h": "暴力無法解決問題", "b": "歷史經驗顯示，暴力很少能化解問題，反而只會種下其他問題的種子並造成巨大災難。", "t": ["和平與非暴力"]}, {"c": 2, "h": "戰爭觀念已然落伍", "b": "在訊息快速流通、世界日益緊密的今天，萬物處於高度互相依存的狀態；摧毀敵人實質上就是摧毀自己，因此戰爭與有仇必報的觀念已經落伍。", "t": ["活在當下", "敵人"]}, {"c": 2, "h": "心靈層次的根本療癒", "b": "世間許多的殺戮、貧富差距、貧困與貪腐，歸根究底都是由心靈問題所造成；若僅發展外在物質與知識，而不注重內心層面的調伏，反而可能製造出更多問題。", "t": ["和平與非暴力"]}, {"c": 3, "h": "地球是唯一的家", "b": "終究人類是一體，地球是我們唯一的家，人人均有責任保護我們的家。做任何事情都不應該局限於家庭或國家的狹隘利益，而要以整個人類的共同福祉為目標，跨越狹隘的國家或種族利益，承擔起全球公民的普世責任感。", "t": ["責任", "普世責任", "家庭"]}, {"c": 3, "h": "視全世界為自身一部分", "b": "我們需要把彼此視為真正的兄弟姐妹，深切關懷彼此的福利；若要實現整體人類的幸福，必須認識到全世界都是自己的一部分。", "t": ["普世價值與責任"]}, {"c": 3, "h": "幸福與力量的源泉", "b": "當考量到自私與貪婪可能帶給他人的痛苦時，進而開發愛心、友善與和睦的「世界責任感」，正是人類力量與幸福的源泉。", "t": ["責任"]}, {"c": 3, "h": "超越短視與政府依賴", "b": "人們常常糾結於短視而忘記基本價值觀；建立更美好的世界不能單靠政府或聯合國的力量，必須加強個人的積極性、信心與決心。", "t": ["普世價值與責任"]}, {"c": 3, "h": "地球公民的行動責任", "b": "社會是由個人集合而成，除非社會中的每個人都產生責任感，否則整個社會無法運作。身為地球公民，全球若受苦我們也將受苦，因此絕不應認為個人的努力毫無意義，每個人都應盡力而為。", "t": ["責任"]}, {"c": 3, "h": "守護良知與正當手段", "b": "人性的價值絕不應該在經濟發展中被犧牲掉，必須使用正當手段，不可為了利益而做出讓自己良心不安的事。", "t": ["普世價值與責任"]}, {"c": 3, "h": "人道救援與人權無國界", "b": "人道救援沒有國界，關注與照顧基本人權也是全人類必須共同面對的責任。", "t": ["責任"]}, {"c": 3, "h": "世界領袖的合作精神", "b": "現今的世界領袖需要學習超越種族、文化及意識形態的差異，正視人類共同的處境，並在互信與寬廣視野的基礎上建立合作精神。", "t": ["普世價值與責任"]}, {"c": 3, "h": "改善窮人條件以弭平鴻溝", "b": "貧富之間的巨大差距必須被重視與解決，其重點不是讓富者變得較不富，而是以改善窮人的生活條件為重。", "t": ["普世價值與責任"]}, {"c": 3, "h": "保護自然取決於內心", "b": "對野生動物、原始森林、海域與江河雪山的保護，最終取決於人類的內心。", "t": ["環保"]}, {"c": 3, "h": "防患於未然的環保責任", "b": "面對珍稀物種與生態環境面臨消失的危機，我們有著不可推卸的責任，必須防患於未然，儘快付諸實施環保治理工作。", "t": ["環保", "責任"]}, {"c": 3, "h": "感同身受動物的處境", "b": "相較於人類擁有權利與醫療資源，一般動物沒有相關福利，只能憑直覺離苦得樂；人類應換位思考、感同身受牠們的處境，並承擔起顧惜一切眾生安危的責任。", "t": ["責任"]}, {"c": 4, "h": "真正的敵人來自內心", "b": "我們真正需要征服的，是內心的憤怒、仇恨與貪瞋痴慢疑，而非在人生中短暫過境的外在敵人。外在敵人若給予尊敬，有機會轉化為朋友；但內心的負面思想永遠是敵人，絕不能妥協，必須勇敢面對與控制。", "t": ["敵人", "憤怒"]}, {"c": 4, "h": "禪修者如戰場上的勇士", "b": "禪修者宛如戰場上的勇士，運用智慧與專注，與內心的貪、瞋、痴、慢、疑作戰。", "t": ["禪修", "智慧"]}, {"c": 4, "h": "調伏「猴子心」", "b": "未經修煉的心如同在樹枝間晃盪的猴子，容易被憤怒、嫉妒、恐懼或過往憾事佔據，白白浪費寶貴的思考時間。修心的根本目的，在於強化內心的力量，使其能專注於真正重要的決定。", "t": ["憤怒", "修心", "嫉妒"]}, {"c": 4, "h": "長期適度，重質不重量", "b": "長期且適度的努力是內心修持成功的關鍵；修行的重點不在於量的多少，而是質的高低，其核心目的無非是讓自己成為更富有慈悲心的人。", "t": ["慈悲"]}, {"c": 4, "h": "順應步調", "b": "培養內在戒律需要時間投入，期望立竿見影是缺乏耐性的表現。", "t": ["戒律"]}, {"c": 4, "h": "切莫苦撐，選擇適當環境", "b": "初學者若發現自己必須苦撐才能繼續，往往是該暫停的徵兆；越是硬撐，心越容易疲乏甚至對修行生厭。環境上宜選擇良好、獨立、安靜、無戰亂與派系鬥爭之地。", "t": ["環保"]}, {"c": 4, "h": "昏沉與沮喪的對治", "b": "當心失去清晰度、陷入昏沉或沮喪時，可透過思惟令人愉快的對境（如佛陀不可思議的特質），或體認暇滿人身與修行機會的難得，來振奮內在精神。", "t": ["修心、忍辱與情緒調伏"]}, {"c": 4, "h": "忍辱是力量的展現", "b": "絕不可誤認寬容與忍辱是軟弱的表徵，那其實是力量的展現。忍辱不是懦弱、投降或消極讓步，而是從容、深思熟慮地決定不採取報復行動，是一種極具自信與勇氣的主動狀態。", "t": ["忍辱", "自信"]}, {"c": 4, "h": "敵人是最好的精神導師", "b": "在遇到敵人企圖傷害的那一刻，正是學習忍辱的最佳時機；敵人是極佳的精神導師，有敵人的存在，才能幫助我們培養忍辱並累積大功德力。", "t": ["敵人", "忍辱"]}, {"c": 4, "h": "忍辱的兩大內在效益", "b": "一、保持沉著與明辨：使人在萬分危急的狀況下仍不失冷靜，並能發揮明辨力。二、創造內在迴旋空間：給予內心控制自己的空間，使人能選擇以適當、慈悲的方式因應，而非衝動行事。", "t": ["忍辱", "慈悲"]}, {"c": 4, "h": "面對煩惱的智慧（寂天菩薩）", "b": "若問題能夠解決或挽救，便不必擔心，去解決即可；若無法解決，擔心除了增加痛苦外毫無意義。", "t": ["智慧"]}, {"c": 4, "h": "識破憤怒的毀滅性", "b": "憤怒的第一個缺點是摧毀內心的平靜，第二個缺點是扭曲對現實的看法。若被憤怒駕馭，將會失去人類最寶貴的辨別是非智慧。將憤怒視為傷害他人以保護自己的武器，是錯誤的。", "t": ["憤怒", "智慧", "平靜"]}, {"c": 4, "h": "憤怒源於自身的誇大", "b": "憤怒常來自於自身對事實的誇大，失去控制時會燒毀理性。心理治療師與科學研究亦指出，我們所憤怒的對象中，有九成的醜惡面來自於自身的誇大。", "t": ["憤怒", "科學"]}, {"c": 4, "h": "解毒劑：耐心與寬容", "b": "面對憤怒或憎恨，無法單靠強壓或隱忍解決，必須積極培養耐心與包容作為解毒劑。帶著智慧的行動比生氣更有力，帶著憤怒的報復往往容易敗事。", "t": ["憤怒", "智慧"]}, {"c": 4, "h": "轉化視角與時機管理", "b": "在憤怒即將爆發之際，訓練自己從不同的觀點審視引發怒意的情境，常能發現其中自有美意。若負面情緒極為強烈，切勿在此時做出重大或無法改變的決定。", "t": ["憤怒"]}, {"c": 4, "h": "化解對摯愛的脾氣", "b": "對摯愛之人容易發脾氣，常源於對他們抱持不切實際且理想化的期待；若能全心接納對方的缺陷，憤怒的根源便會消失。", "t": ["憤怒"]}, {"c": 4, "h": "以利他療癒悲傷與焦慮", "b": "少想到自己、多關心他人，並嘗試去療癒他人的悲傷與憤怒，是消除自身焦慮、嫉妒與不安的最佳良藥。", "t": ["焦慮", "利他", "憤怒"]}, {"c": 5, "h": "重視經論學習，反思導師與教法", "b": "很多人聽聞佛法內容時打瞌睡，一聽到「灌頂」就精神大振，這是教法衰敗的原因之一。要接受灌頂絕非易事，必須具備菩提心、空性見與穩固的三摩地。理智辨析與經論思惟的重要性，勝過盲目求取灌頂或儀軌。", "t": ["菩提心", "佛法"]}, {"c": 5, "h": "經論與口訣不可分割", "b": "經論與口訣是一體的，大藏經的三百多部典籍都是為了幫助調伏心續而說，切不可將「講的法」與「修的法」看作無關。若只祈求法輪常轉，自己卻把經論學習拋在一旁，便失去了學佛的本意。", "t": ["佛法與教義"]}, {"c": 5, "h": "檢視教法與導師的權利", "b": "佛教文化中極具特質的一點，是修行者擁有檢視教法的權利，即使是導師的話也可以被客觀檢視。對初學者而言，隨意貫徹「把上師的一切行為都看成十全十美」的觀念，是非常危險的。", "t": ["佛法與教義"]}, {"c": 5, "h": "將理論轉化為心靈經驗", "b": "學了佛法之後若不透過禪修去實踐，容易變成「麻木不仁」的佛教徒——懂得高談闊論理論，卻未能將其轉化為活生生的內在經驗。", "t": ["禪修", "佛法"]}, {"c": 5, "h": "佛法建立於心，而非身口", "b": "能言善辯或擅長持咒念佛，並不代表真正懂得佛法；真正的佛法建立於內心的轉變，而非外在的身口形式。", "t": ["佛法"]}, {"c": 5, "h": "宗教如藥", "b": "宗教就像藥物，唯一的價值在於生病時能發揮療效。宗教應在心靈陷入困境時發揮作用，而非在順境時拿出來向人炫耀。", "t": ["宗教"]}, {"c": 5, "h": "戒律須出於自願", "b": "戒律的重點在於必須是個人「自願採納」的。出於外在權威、文化或宗教恐懼所強加的紀律，往往無法帶來真實的內在轉變。", "t": ["戒律", "宗教"]}, {"c": 5, "h": "持戒動機的三種層次", "b": "求善趣：若持不殺戒僅為了得善趣身，一旦獲得善身，持戒力量便告用盡。求解脫：若動機為求解脫，持戒力量在未解脫前將一直存在。利眾生：若動機是為了幫助一切眾生，這份力量將永遠不會乾涸。", "t": ["動機"]}, {"c": 5, "h": "加持的真實意涵", "b": "加持並非源自外在事物或神秘力量。當你心中正面的良善特質增長、負面不健全的品質削弱時，這才是獲得了真正的加持。", "t": ["加持"]}, {"c": 5, "h": "摒除急功近利的短視", "b": "希望短期內有所收穫，或以為搖幾年金剛鈴就能一生成佛，是不切實際且缺乏深刻認識的心態。修行需要長期的堅持與遠大的眼光。", "t": ["佛法與教義"]}, {"c": 6, "h": "擺脫過度憂慮與盲目追逐", "b": "許多人把生命花在追逐轉眼即逝的樂趣上，或因過度擔心未來而無法享受現在，導致自始至終「無法活在當下」；活著時忘了生命短暫，死時才發現自己未曾真正好好活過。", "t": ["活在當下"]}, {"c": 6, "h": "「今天」是唯一的時機", "b": "一年之中唯有兩天我們什麼都不能做：一個叫「昨天」，一個叫「明天」。因此「今天」才是我們該去愛、去相信與特別好好生活的唯一時機；用心過好今天，便能讓它成為經典。", "t": ["活在當下"]}, {"c": 6, "h": "放下競爭與嫉妒", "b": "去掉嫉妒，不要老是想著要贏過別人或爭強好勝，許多煩惱與焦慮就會一掃而空。嫉妒是一種極具破壞性的負面情緒，會阻止心靈的進步。", "t": ["嫉妒", "焦慮"]}, {"c": 6, "h": "以謙遜對治傲慢", "b": "把自己看得比別人優越的傲慢心理，是發展利他態度的主要障礙。無論與誰相處，保持謙遜的態度能讓善良品質不斷增加，否則容易陷入嫉妒與瞋怒之中。", "t": ["傲慢", "謙遜", "利他"]}, {"c": 6, "h": "保持樂觀，拒絕自我挫敗", "b": "保持樂觀極為重要；若一開始就因困難重重而覺得不可能做到，這種悲觀與自我挫敗的心態才是失敗的真正來源。", "t": ["樂觀"]}, {"c": 6, "h": "轉化問題的視角", "b": "當我們以樂觀和希望來迎接困難時，就是在把麻煩從根清除。面對艱困挑戰時，若能採取更寬廣的視野來審視問題，龐大的難題也會變得微不足道。", "t": ["樂觀"]}, {"c": 6, "h": "坦然面對過錯與自我原諒", "b": "犯了錯要勇敢承認並痛改前非，但切莫在悔恨中一蹶不振或陷入絕望。絕望往往源於無法原諒自己；要能肯定自己具備改過自新的能力，並從經驗中學習。", "t": ["自省"]}, {"c": 6, "h": "真誠動機，無悔無咎", "b": "只要懷著真誠純潔的動機行事，即使事情最後不如所願，內心深處也不會感到罪咎或遺憾。", "t": ["動機"]}, {"c": 6, "h": "言行坦誠一致", "b": "做人應當坦誠，一言一行前後要保持一致。", "t": ["生活的智慧"]}, {"c": 6, "h": "言語節制與沉默的智慧", "b": "說話應在必要時才發言，缺乏必要卻說得太多，就像任憑花園裡長滿雜草。謹記在許多時刻，適時的沉默往往是最好的答案。", "t": ["沉默", "智慧"]}, {"c": 7, "h": "尋求超越宗教的內在價值", "b": "推動內在價值的需要是每個人都具備的。必須找出與宗教無關的方法來普及內在價值，以此造就全人類的道德觀。", "t": ["宗教"]}, {"c": 7, "h": "正確認識政教分離的世俗主義", "b": "世俗主義並非排斥或不尊敬宗教，而是尊敬所有的宗教，同時也包含尊敬無宗教信仰者的權利。", "t": ["宗教"]}, {"c": 7, "h": "超越執著與強加信仰", "b": "所有宗教本質上都在啟發愛心、誠懇與誠實；但若過度執著於自己的信仰並強迫他人接受，難免會引發紛爭與衝突。", "t": ["宗教"]}, {"c": 7, "h": "腦與心即為寺廟，慈悲才是哲學", "b": "外在的寺廟與艱深的哲學並非不可或缺；「腦與心即為寺廟，慈悲才是哲學」。慈悲與善良的心靈，即是最好的寺廟與哲學。", "t": ["慈悲"]}, {"c": 7, "h": "日常生活中善良溫暖的心", "b": "生命的根本原則在於日常生活中擁有一顆善良、溫暖的心。只要對他人有同情心、對自己有責任感，不論是否識字，也不論信仰佛陀、上帝、其他神祇或什麼都不信，都能活得自在。", "t": ["責任"]}, {"c": 7, "h": "避免把最緊要的拋卻腦後", "b": "隨著年紀增長，人們常過度執著於種族、宗教或國籍等微不足道的分歧，卻忽視了情感、友誼與互助合作等最緊要的人性核心。", "t": ["宗教"]}, {"c": 7, "h": "心靈革命並非宗教革命", "b": "所號召的心靈革命，絕非號召宗教革命，亦非倡導出世生活或某種神奇神秘的事物。", "t": ["宗教"]}, {"c": 7, "h": "激進的再教育", "b": "心靈革命的核心是一場「激進的再教育」（Radical Re-education），旨在讓人們不再習慣性地只在乎自己，而是將關懷轉向更廣大的生命社群，並體認到個人利益與他人利益必須兼顧。", "t": ["教育"]}, {"c": 7, "h": "佛教不可能亦不必成為普世宗教", "b": "任何美好的宗教（包括佛教）都永遠不可能成為普世唯一的宗教。地球上 70 億人口具有不同的天性與文化背景，需要多彩多姿的宗教與法門來適應不同人群的需求；因此唯一的希望在於推動普世的教育。", "t": ["宗教", "教育"]}, {"c": 7, "h": "宗教的最高目的是服務與造福人群", "b": "所有宗教的最高目的都在於服務及造福人群，用以促進全人類的幸福與和平，而不是用來勸說世人皈依信教。", "t": ["服務", "宗教", "和平"]}, {"c": 7, "h": "身體力行勝於言語宣揚", "b": "單憑言語宣揚宗教價值難以令人信服；若宗教信仰者不關心愛、慈悲與寬恕的實質信息，宗教便會趨於腐敗。唯有自身身體力行、樹立榜樣，才能展現崇高的品格。", "t": ["沉默", "宗教", "慈悲"]}, {"c": 7, "h": "跨信仰的誠心尊敬與學習", "b": "每一種信仰都有其獨特貢獻，不同宗教是以不同的教理哲學來實踐相同的慈悲與善行。遇到不同信仰或教派時，應以尊重的方式互相請教與交流，使僧俗大眾彼此和合。", "t": ["慈悲", "宗教"]}, {"c": 8, "h": "教育腦袋，亦需教育心靈", "b": "在教育孩子的腦袋時，絕不能忽略教育他們的心。現代教育不應僅傳授知識與技能，更應培養心地的品質，才能讓學生成為兼具知識與溫暖愛心的人。", "t": ["教育"]}, {"c": 8, "h": "導入內在價值與情緒訓練", "b": "學校課程應當理所當然地導入愛心、慈悲、正義、寬恕等不可或缺的內在價值。現代人普遍缺乏對治不安情緒的必要訓練，這些心靈層面的實踐必須積極導入現代教育之中。", "t": ["慈悲", "教育", "寬恕"]}, {"c": 8, "h": "非暴力與責任感的培育", "b": "當孩子們在學校整合了非暴力與和平解決衝突的道理後，將更能察覺到自己的感覺與情緒，並領悟到他們對自己以及對更遼闊世界所肩負的重大責任感。", "t": ["非暴力", "責任", "和平"]}, {"c": 8, "h": "世俗倫理教育的心靈革命", "b": "心靈革命並非號召宗教革命或出世生活，而是透過與宗教無關的世俗倫理教育進行「激進的再教育」，引導人們不再習慣性只在乎自己，而是將關懷轉向更廣大的生命社群，兼顧彼此的利益。", "t": ["教育", "倫理", "世俗倫理"]}, {"c": 8, "h": "教育是脫貧與發展的基石", "b": "慈善捐款最迫切需要的領域是健康與教育；教育是人們取得技能與智慧的方法，唯有透過教育方能讓人們脫離貧困。", "t": ["教育", "智慧"]}, {"c": 8, "h": "身教重於言教", "b": "在教導道德意識與內在價值時，單靠口頭宣揚絕對不夠，身教才是最重要的。若教師口口聲聲說仁慈重要，卻未能以身作則，學生便不會覺得教誨具說服力；反之，教師若展現對學生真心誠意的關懷，親身示範何謂仁慈，就能更有效地說明論點、感化心靈。", "t": ["身教"]}, {"c": 8, "h": "好老師的三大標記", "b": "傳統西藏僧侶教育中，衡量一位好老師有三項關鍵標記：一是學有專精，二是道德操守，三是仁慈善良。", "t": ["教育", "西藏文化"]}, {"c": 8, "h": "家庭是社會建立的基石", "b": "家庭在傳授道德價值上扮演著極為重要的角色。若家中氣氛祥和，不僅傳授知識，還教導孩子正直且為他人著想的生活方式，整個社會其餘部分的建立將不再是問題。", "t": ["家庭", "平靜"]}, {"c": 8, "h": "從小培養相處與不記恨的習慣", "b": "孩童時代即應學會如何與他人相處及互助合作。雖然小爭執與小衝突無法避免，但重點是養成既往不咎、不記恨在心的良好習慣。", "t": ["教育、倫理與心靈財富"]}, {"c": 8, "h": "鼓勵青年培養正向智識與善心", "b": "必須鼓勵年輕世代發展更正面的智識，並持續培養內在善心的力量。", "t": ["教育、倫理與心靈財富"]}, {"c": 8, "h": "倫理是政治與宗教的共同基礎", "b": "倫理對於政治家與宗教工作者同樣重要；政治統治者若忘記道德規範，必然發生危險後果。不論信仰上帝或因果，倫理必定是所有宗教的基礎。", "t": ["倫理", "宗教"]}, {"c": 8, "h": "寬廣視角的職場智慧", "b": "當在職場遭遇懷有敵意的同事或過分苛求的主管時，保持寬廣視野極有幫助——體認到對方的敵意可能源自家庭問題或其他無關的事，而非針對自己。", "t": ["智慧", "家庭"]}, {"c": 8, "h": "非壓迫性的健康競爭與自省", "b": "活在現代社會要避免競爭雖然困難，但我們可以在不去壓迫別人的狀況下做得比他人更好。確實了解自己能產生內在力量，面對證據確鑿的批評時能坦然接受，並利用機會更了解自己。", "t": ["自省"]}, {"c": 8, "h": "堅守核心價值觀", "b": "在展開雙臂放開心胸迎向改變時，切記千萬不可放掉自己的核心價值觀。", "t": ["教育、倫理與心靈財富"]}, {"c": 8, "h": "物質財富的自然局限", "b": "時間與地理位置勢必會局限一個人一生中所能累積的財富數量，因此凡事知足並為欲望設定合理界限，是較為明智的作法。", "t": ["環保", "知足", "欲望"]}, {"c": 8, "h": "心靈財富的無窮潛力", "b": "相較之下，心靈財富與內在品質的累積具有無窮的潛力，且不受自然環境與空間的限制。對於這種不受自然限制的心靈美德，我們不該滿足於現狀，而應不斷努力追求更多。", "t": ["心靈財富", "環保"]}, {"c": 8, "h": "破除世俗顛倒的迷思", "b": "遺憾的是，現代社會多數人往往反其道而行——從不滿足於已擁有的物質財物，反而驕矜自喜於貧乏的心靈財富。", "t": ["心靈財富"]}, {"c": 9, "h": "思惟死無常的真實涵義", "b": "一般世俗的思惟是「我快要死了，所以我感到害怕」；但真正的死無常思惟並非出於恐懼，而是體認：「我們如今獲得了極為難得的暇滿人身，如果在尚未圓滿這份人身意義之前就離世，豈不是極為可惜？」", "t": ["無常"]}, {"c": 9, "h": "日日策勵精進", "b": "透過對死無常的思惟，能策勵人們在當下精進修行、對自己負責，使人在一天又一天中，對善法與精神成長自然生起不斷增長的精進心。", "t": ["環保", "無常", "活在當下"]}, {"c": 9, "h": "讓心靈駐留於深刻事物", "b": "越早思考死亡時間的不確定性與迫切性，臨終時就越能擁有勇氣與快樂；心靈也越能駐留於更深刻的事物上，不被瑣事牽絆，從而變得祥和、有紀律且具足福德。", "t": ["快樂", "臨終", "平靜"]}, {"c": 9, "h": "臨終的三種境界", "b": "真正的修行者在臨終時會展現三種層次：勝歡喜——上等修行者已圓滿一生所應做的殊勝善業，臨終時感到非常歡喜；中不畏——中等修行者面對死亡心無恐懼；劣不悔——下等修行者因已盡己所能去實踐，內心毫無悔恨。", "t": ["臨終"]}, {"c": 9, "h": "生死兩全的坦然準備", "b": "面對重病或臨終者，不論是復原或死亡，都需要做好準備；彼此可以坦然思索死亡的迫切性而無需隱瞞，才能無憾地面對死亡。", "t": ["臨終"]}, {"c": 9, "h": "陪伴臨終者", "b": "當陪伴他人臨終時，切莫在他們面前悲嘆離去、緊抓住對方或哭泣，也不可引發他們的執著、憤怒或仇恨；應透過提醒他們更深入的修行與法教，協助他們有意義且安詳地離去。", "t": ["臨終", "憤怒"]}, {"c": 9, "h": "現代人的荒謬惡性循環", "b": "許多人陷入矛盾的生存盲點——為了賺錢而犧牲健康，再花錢去修復身體；接著又因過度擔心未來而無法享受現在，始終「無法活在當下」；臨終時才驚覺自己未曾真正好好活過。（「今天」才是唯一的時機，見〈生活的智慧〉。）", "t": ["活在當下", "臨終", "智慧"]}, {"c": 9, "h": "百年過客的建設性運用", "b": "人類壽命頂多百年左右，與地球歷史相比極為短暫。良知告訴我們，不該用這短暫的生命去製造他人的痛苦，而應趁著在這個世上的短暫過程，致力於有建設性、利他的事業，做些對自己與他人有用的事情，至少不要傷害他人或帶來麻煩。", "t": ["利他"]}, {"c": 9, "h": "無憾的終點", "b": "只要我們善用了每分每秒，當最後一日來臨時，便能滿懷喜悅且毫無遺憾地迎接生命盡頭。", "t": ["死無常與生命的意義"]}, {"c": 9, "h": "避免人生盡頭的悔恨", "b": "想在走到人生盡頭時不至於悔恨交加，最好的方法就是在當下學會對自己負責、對他人懷有同情心，讓良知引導自己的生活。", "t": ["活在當下"]}, {"c": 9, "h": "生命真正的價值", "b": "生命真正的價值與快樂泉源，來自耕耘愛與慈悲，以及無私地服務人群；關心他人的福祉，自身便能感受到真正的幸福與平穩。", "t": ["慈悲", "快樂", "服務"]}, {"c": 9, "h": "累積無限的心靈財富", "b": "物質財富受限於時間與環境，應知足並設定界限；而心靈財富的累積卻有著無窮的潛力。當一個人過著坦誠、善良且有貢獻的人生，在生命盡頭回顧過往時，便能安然無憾。", "t": ["心靈財富", "環保", "知足"]}, {"c": 10, "h": "欲望如「口渴的人喝海水」", "b": "欲望具有強烈的擴張特性，即使當下獲得滿足，過後仍會一再出現且一次比一次劇烈；盲目追逐欲望就像口渴的人喝海水，只會越喝越渴、難以解渴，讓人陷入無休止的不安、自卑與沮喪。", "t": ["欲望", "活在當下"]}, {"c": 10, "h": "知足是中庸的美德", "b": "知足意味著野心有所保留、欲望有所節制，並非消極停滯。過著樸實的生活並為個人欲望設定合理的界限，能擺脫因無窮欲望所帶來的不安全感、不足感與沮喪煎熬，安住於潛在的滿足心境。", "t": ["知足", "欲望"]}, {"c": 10, "h": "快樂來自知足，而非財富", "b": "藏文俗諺說：「在可憐的富人門口，睡著心滿意足的乞丐。」快樂的根源絕非外在財富，而是為自己的欲望設限、在界限中過著滿足的生活。當心存不滿時，欲望永無止境；若能練習知足的思維，告訴自己「我需要的東西早已擁有」，心靈便能獲得平靜。", "t": ["知足", "快樂", "欲望"]}, {"c": 10, "h": "金錢與權力買不到快樂", "b": "金錢與權力皆無法購買或帶來真正快樂的人生，因為所有的痛苦與快樂本質上都與內心狀態息息相關。若僅沉迷於感官的短暫愉悅，便無法善用人類奇妙的大腦與智慧，體會到內心深處的和諧。", "t": ["快樂", "智慧"]}, {"c": 10, "h": "服務人群是最大的快樂泉源", "b": "人生中快樂與滿足的最大泉源，來自於體諒與無私地服務人群。佛法與人生的最終目的並非逃避世俗或離世獨處，而是為了服務他人而留在世間，透過無私服務他人來貢獻社會。", "t": ["服務", "快樂", "佛法"]}, {"c": 10, "h": "關心他人福祉與自身幸福連動", "b": "當我們越去關心他人的幸福與福祉，自身反而越能感受到幸福與快樂。在為他人付出的過程中，最重要的是秉持純粹的動機，一心一意為對方著想，而不去指望回報。", "t": ["快樂", "動機"]}, {"c": 10, "h": "佈施無財富限制", "b": "佈施絕非富人的專利，也不僅限於金錢財物，是慈心與悲心最自然的外在表現。在日常生活中對他人展現友善、專注與誠實的態度，適時給予讚美、安慰或抽空陪伴，都是極具價值的佈施，能讓人體會到「因他人之樂而樂」的喜悅。", "t": ["佈施", "環保"]}, {"c": 10, "h": "少想自己，多關心別人", "b": "少關注自己、多關心與體諒他人，是化解內心焦慮的良藥；當能真切看見他人的困難時，自身的焦慮與煩惱便顯得不再龐大。當我們將注意力從「我缺乏什麼」轉移至「我能為他人付出什麼」時，內心會產生強烈的充實感與幸福感。", "t": ["焦慮"]}, {"c": 10, "h": "調伏的心帶來祥和", "b": "一顆經過調伏的心能帶給人真正的祥和、放鬆與快樂；若心未被調伏，不論外在情境多麼美妙，人都會受困於恐懼與擔憂之中。", "t": ["平靜", "快樂"]}, {"c": 10, "h": "敞開心胸，獲得平穩", "b": "只要主動向他人敞開心胸、去掉嫉妒與傲慢，內心深處便會產生無限的平穩與自在。", "t": ["嫉妒", "傲慢"]}, {"c": 11, "h": "自然的和諧共存", "b": "互相依存是大自然的基本法則；許多微小的生物即使未受過宗教、法律或教育的薰陶，卻具備天生的了悟而能合作共存。隨著訊息流通加速、世界變得越來越緊密，人類更應著眼於未來，尊重不同的文化與環境。", "t": ["環保", "教育", "宗教"]}, {"c": 11, "h": "保護環境取決於內心", "b": "對野生動物、原始森林、廣闊海域、江河與連綿雪山的保護，最終皆取決於內心。人類不能僅顧及自身利益或被自私貪婪驅使，而應承擔起普世的世界責任感，顧惜生存於地球上一切眾生的幸福與安危。", "t": ["環保", "責任"]}, {"c": 11, "h": "亞洲水資源的命脈", "b": "西藏高原的生態環境直接影響亞洲整體的飲水資源，數以百萬計的亞洲人民皆依賴來自雪域高原的各大江河，因此環境保護關乎整體人類的福祉。", "t": ["環保", "西藏文化"]}, {"c": 11, "h": "防患於未然的環保任務", "b": "當前許多珍稀物種（包含動物、植物、昆蟲、微生物）及其生存環境正面臨消失危機。我們有責任防患於未然，並在日常生活中將環保的宣導、教育與表率當作自己的任務來堅持落實。", "t": ["環保", "教育", "責任"]}, {"c": 11, "h": "世界最早的環保法規", "b": "歷史上的西藏遵從佛教戒律，使野生動物免於遭受傷害；早在十七世紀，西藏就已頒布「封山禁獵」的告示，堪稱世界上最早有關環境保護的法規之一。", "t": ["環保", "西藏文化", "戒律"]}, {"c": 11, "h": "動物是自由的象徵", "b": "藏人將共存於環境中的動物看作自由的象徵並推崇備至；在西藏的繪畫藝術、節慶與各類活動中，處處體現出對大自然保護與尊重的態度。", "t": ["環保", "西藏文化"]}, {"c": 11, "h": "文化的實質是愛與慈悲", "b": "保護西藏文化的本質，在於保存一種和平與非暴力的文化，說到底是愛與慈悲的文化，這是當今世界真正重要的精神資產。", "t": ["慈悲", "西藏文化", "非暴力"]}, {"c": 11, "h": "超越外在儀軌的日常實踐", "b": "數千年來學習佛陀教法，重點在於運用所學讓自己獲得幸福快樂的人生，這才是宗教與文化的珍貴之處；單純的誦經祈禱與宗教儀軌只是外在形式，重點在於將和平、非暴力與慈悲的智慧內涵實踐於日常生活之中。", "t": ["宗教", "慈悲", "非暴力"]}, {"c": 11, "h": "保有傳統美德與靈魂", "b": "若失去了傳統美德，就等於失去了文化的靈魂。即使具備再高的現代教育水準，仍須注重傳統美德，培養一顆慈悲利他心。", "t": ["慈悲", "利他", "教育"]}, {"c": 11, "h": "藏文語言文字的獨特價值", "b": "藏文是能夠圓滿詮釋大小乘顯密圓滿教法的獨特語言；保存祖先留下來的西藏語言與文字遺產，是將完整教義與內在智慧精確傳承給後世的重要載體。", "t": ["西藏文化", "智慧"]}, {"c": 11, "h": "那爛陀傳承與精神自豪", "b": "藏傳佛教承襲了古代印度那爛陀寺嚴謹的聞思傳統。年輕一代在接受現代知識與科學教育的同時，更應注重西藏傳統美德與慈悲利他心的培養。", "t": ["西藏文化", "慈悲", "利他"]}, {"c": 12, "h": "追求實相的共同目標", "b": "科學與佛學的基本目標是一致的，皆強調透過嚴謹審慎的驗證來探索現實的本質與事物的真相；兩者皆不盲從先入為主的成見，而是客觀檢視問題並透過論證得出結論。", "t": ["科學"]}, {"c": 12, "h": "以經驗追求事實", "b": "兩者都建立在堅強的經驗基礎上。一旦科學分析明確指出某些傳統佛學觀點（如地理上的須彌山說法）與現實不符，佛學便服從客觀事實並放棄原先立場，這讓佛教的世界觀變得更加豐富多彩。", "t": ["科學"]}, {"c": 12, "h": "外在觀察與內觀訓練的結合", "b": "科學擅長使用精密的儀器與抽象數學推理分析外在現象，將人類的感官能力與知識視野無限延伸，其成果更容易為廣大世俗大眾所接受；佛學則擁有深厚而全面的「心類學」與內觀禪修訓練，專注於心靈與大腦層次的探索，透過個人經驗的冥想與內觀檢驗進行。", "t": ["禪修", "科學"]}, {"c": 12, "h": "心類學輔助科學研究", "b": "源自那爛陀傳承的佛學心類學，能提供對心靈與大腦運作的深刻理解，為現代科學在心靈與大腦議題的研究上提供豐富的心靈經驗模型、理論與實踐輔助。", "t": ["科學", "西藏文化"]}, {"c": 12, "h": "前沿科學的跨界合作", "b": "出家僧人與神經科學家展開合作，測試靜坐禪修對大腦功能的具體影響。這種合作的目的並非宣揚宗教信仰，而是透過科學方法研究傳統心靈修持的潛能，並共享研究成果以減輕人類的苦難。", "t": ["科學", "禪修", "宗教"]}, {"c": 12, "h": "為科技發展注入倫理方向", "b": "任何對人類身心改變的科學研究，都會面臨「何謂善意改變」等倫理道德課題。宗教界、科學家與大眾共同探討，能為現代科學技術帶來更完善的世俗倫理指引，確保科技造福全人類。", "t": ["倫理", "科學", "宗教"]}], "chs": [{"no": "序", "t": "內在和平與普世責任", "s": "序言・第 4 頁"}, {"no": "一", "t": "慈悲與利他", "s": "慈悲與利他・第 7 頁"}, {"no": "二", "t": "和平與非暴力", "s": "和平非暴力・第 39 頁"}, {"no": "三", "t": "普世價值與責任", "s": "普世價值與責任・第 69 頁"}, {"no": "四", "t": "修心、忍辱與情緒調伏", "s": "修心與忍辱・第 101 頁　情緒與療癒・第 293 頁"}, {"no": "五", "t": "佛法與教義", "s": "佛法與教義・第 133 頁"}, {"no": "六", "t": "生活的智慧", "s": "生活的智慧・第 165 頁"}, {"no": "七", "t": "超越宗教", "s": "超越宗教・第 197 頁"}, {"no": "八", "t": "教育、倫理與心靈財富", "s": "教育與倫理・第 229 頁"}, {"no": "九", "t": "死無常與生命的意義", "s": "死無常與生命的意義"}, {"no": "十", "t": "知足、平靜與快樂泉源", "s": "快樂──過有意義的人生"}, {"no": "十一", "t": "環境保護與文化遺產", "s": "自然與西藏文化"}, {"no": "十二", "t": "科學與佛學的對話", "s": "科學與佛學如何互補"}], "props": ["<path d=\"M-80 4 V-130\" fill=\"none\" stroke=\"#2a2521\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /><path d=\"M80 4 V-110\" fill=\"none\" stroke=\"#2a2521\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /><path d=\"M-80.0 -124.0 L-57.1 -109.4 L-34.3 -98.7 L-11.4 -91.9 L11.4 -89.1 L34.3 -90.1 L57.1 -95.1 L80.0 -104.0\" fill=\"none\" stroke=\"#2a2521\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /><rect x=\"-77.5\" y=\"-115.7\" width=\"17.8\" height=\"14.3\" rx=\"0\" fill=\"#2f63c4\" stroke=\"#2a2521\" stroke-width=\"1.4\" stroke-linejo
