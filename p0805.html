<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>翻牌複習｜大乘起信論 期末複習</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2e8d0;
  --card: #f8f2e2;
  --card2: #f4edda;
  --line: #d4bc8a;
  --gold: #8a5a08;
  --gold2: #7a4e06;
  --cream: #2a2018;
  --ivory: #1e1810;
  --mist: #6a5a3a;
  --dim: #8a7a5a;
  --green: #2e6845;
  --red: #a5342a;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
}
body {
  background: var(--bg);
  color: var(--cream);
  font-family: 'Noto Serif TC', serif;
  font-weight: 300;
  -webkit-text-size-adjust: 100%;
  display: flex;
  flex-direction: column;
}

/* ── Top bar ── */
.topbar {
  flex-shrink: 0;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--line);
}
.topbar-title {
  font-family: 'LXGW WenKai TC', serif;
  font-size: 15px;
  font-weight: 500;
  color: var(--ivory);
  text-align: center;
  margin-bottom: 10px;
  letter-spacing: .1em;
}
.topbar-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.select-unit {
  font-family: 'Noto Serif TC', serif;
  font-size: 13px;
  color: var(--cream);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 6px 12px;
  outline: none;
  max-width: 180px;
}
.toggle-btn {
  font-family: 'Noto Serif TC', serif;
  font-size: 12.5px;
  color: var(--mist);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 6px 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.toggle-btn.active { background: var(--gold); color: #fff; border-color: var(--gold); }
.toggle-btn:hover { border-color: var(--gold); }

/* ── Progress ── */
.progress-wrap {
  flex-shrink: 0;
  padding: 10px 20px 0;
}
.progress-text {
  text-align: center;
  font-size: 12px;
  color: var(--dim);
  letter-spacing: .15em;
  margin-bottom: 6px;
}
.progress-bar {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--gold);
  transition: width .3s ease;
}

/* ── Stage ── */
.stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  min-height: 0;
  perspective: 1600px;
}
.flip-card {
  width: 100%;
  max-width: 560px;
  height: 100%;
  max-height: 560px;
  position: relative;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.4,0,.2,1);
}
.flip-card.flipped { transform: rotateY(180deg); }

.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  background: var(--card);
  border: 1px solid rgba(212,188,138,.6);
  border-radius: 20px;
  box-shadow: 0 20px 50px rgba(138,90,8,.14);
  padding: 28px 26px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.face-front { }
.face-back { transform: rotateY(180deg); background: var(--card2); }

.face-tag-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  flex-shrink: 0;
}
.face-tag {
  font-size: 11.5px;
  letter-spacing: .2em;
  color: var(--gold2);
  background: rgba(138,90,8,.08);
  padding: 4px 10px;
  border-radius: 20px;
}
.face-star {
  font-size: 22px;
  color: var(--dim);
  cursor: pointer;
  line-height: 1;
  user-select: none;
  transition: transform .15s;
}
.face-star:hover { transform: scale(1.15); }
.face-star.on { color: var(--gold); }

.qnum-big {
  font-family: 'LXGW WenKai TC', serif;
  font-size: 15px;
  color: var(--gold2);
  margin-bottom: 8px;
  font-weight: 500;
}
.question-text {
  font-family: 'LXGW WenKai TC', serif;
  font-size: clamp(22px, 5.6vw, 30px);
  font-weight: 500;
  color: var(--ivory);
  line-height: 1.6;
  flex: 1;
  display: flex;
  align-items: center;
}
.options-text {
  font-size: clamp(15px, 3.6vw, 18px);
  color: var(--mist);
  line-height: 1.9;
  margin-top: 14px;
  flex-shrink: 0;
}
.face-hint {
  text-align: center;
  font-size: 11px;
  color: var(--dim);
  letter-spacing: .25em;
  margin-top: 10px;
  flex-shrink: 0;
}

.answer-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 16px;
  flex-shrink: 0;
}
.answer-label {
  font-size: 13px;
  color: var(--dim);
  letter-spacing: .15em;
}
.answer-value {
  font-family: 'LXGW WenKai TC', serif;
  font-size: clamp(26px, 6.5vw, 34px);
  font-weight: 600;
}
.answer-value.yes { color: var(--green); }
.answer-value.no { color: var(--red); }
.answer-value.pick { color: var(--gold2); }

.explanation-text {
  font-size: clamp(16px, 3.8vw, 19px);
  color: var(--cream);
  line-height: 1.9;
  flex: 1;
}
.explanation-text strong { color: var(--gold2); font-weight: 600; }

/* ── Controls ── */
.controls {
  flex-shrink: 0;
  padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.ctrl-btn {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--card);
  border: 1.5px solid var(--line);
  color: var(--gold2);
  font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(138,90,8,.1);
  transition: transform .15s, background .15s;
  flex-shrink: 0;
}
.ctrl-btn:hover { transform: translateY(-2px); }
.ctrl-btn:active { transform: translateY(0); }
.ctrl-btn.disabled { opacity: .3; pointer-events: none; }
.ctrl-btn-flip {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, #8a5a08, #b5891d);
  color: #fff;
  font-size: 24px;
}

.empty-state {
  text-align: center;
  padding: 40px 24px;
  color: var(--dim);
  font-size: 15px;
  line-height: 2;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }

@media(min-width:768px){
  body { align-items: center; }
  .app-frame {
    width: 100%;
    max-width: 640px;
    height: 100%;
    max-height: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: rgba(248,242,226,.5);
    border-radius: 24px;
    box-shadow: 0 40px 100px rgba(42,32,24,.15);
    border: 1px solid rgba(212,188,138,.4);
    overflow: hidden;
  }
}
.app-frame { flex: 1; display: flex; flex-direction: column; min-height: 0; width: 100%; }
</style>
</head>

<script id="qdata" type="application/json">[{"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "1", "question": "《起信論》所說「始覺」，既名為「始」，表示覺性原本不存在，須待修行後方才產生。（是/否）", "options": "", "answer": "否", "explanation": "覺性本來是一個，非修行後新生。「始覺」乃依「**不覺**」返流覺照而安立的**假名**，**始覺有功、本覺乃顯**，並不是別生一覺。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "4", "question": "修行「返妄歸真」與眾生迷失之次第相反：起惑，由細至粗；覺悟，則由粗入細，先覺滅相，終至覺生相。（是/否）", "options": "", "answer": "是", "explanation": "眾生迷失是從**微細發展到粗重**，而修行覺悟則是從**粗重破除到微細**（先覺滅相，最終覺生相），兩者方向相反。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "3", "question": "始覺即是返妄歸真的過程，修行要從四相流轉中覺悟，其中覺滅相就能解脫，因無滅即無生，無生即解脫。（是/否）", "options": "", "answer": "否", "explanation": "只覺察到「滅相」是不夠的，必須一路深入歷經**滅、異、住、生四相**，破除了最源頭的「**生相無明**」，回到心源才能真正解脫。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "14", "question": "有關覺「四相」，對應的修行位階，下列何者錯誤？", "options": "①覺異相——二乘、三賢菩薩　②覺住相——法身菩薩　③覺生相——菩薩地盡，滿足方便，一念相應　④覺滅相——初發意菩薩", "answer": "④", "explanation": "覺滅相對應「**十信外凡位**」之凡夫人，而不是初發意菩薩；初發意菩薩（三賢位）所對的是「**覺異相**」。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "15", "question": "關於「四相俱時而有，本來平等，同一覺故」，下列何者為非？", "options": "①四相流轉唯是一夢心，各隨智力淺深分而覺　②四相即生住異滅相，這明顯與「俱時而有」相矛盾　③處夢謂經年，悟乃須臾頃　④真心隨流作染淨等法，染淨諸法本無自體，唯一真心", "answer": "②", "explanation": "「**俱時**」是就**體性**而言——四相同依一心、無有前後，非謂時間上同時出現。四相其實都是同一真心隨緣變現的（猶如一夢），並沒有時間的先後。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "5", "question": "所謂「觀無念」，就是要在念中不迷，唯有將大腦「放空」、「不思考」，把念頭鈍住，才能趨向佛智。（是/否）", "options": "", "answer": "否", "explanation": "「**觀無念**」是指念頭生起時**不隨之流轉、了了分明**，而不是像木頭一樣放空不思考。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "6", "question": "「能觀無念者，則為向佛智。」觀無念，就是說要向外求佛給我們智慧。（是/否）", "options": "", "answer": "否", "explanation": "「向佛智」是指我們**向內修行**，契入與佛一樣的清淨智慧，而不是向外求佛賜給我們智慧。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "10", "question": "以「貪吃」為例，下列何者最符合「不覺、始覺、本覺」之義？", "options": "①看到喜歡的食物立刻忍住不吃，使心空白即回到本覺　②面對食物起貪念時，順著欲望去吃是不覺；能當下覺察而不隨之轉是始覺；知貪念空無自性、心本不染是本覺　③貪念生起時加以壓制使其完全不起即是始覺，久而久之成本覺　④只有完全沒有食慾才是回到本覺", "answer": "②", "explanation": "順著欲望去吃是**不覺**；能當下覺察並克制貪念是**始覺**；知道貪念本來空無自性是**本覺**。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "11", "question": "依照始覺的四個位階，凡夫人覺知「滅相」，雖能止惡，但在定義上應屬於下列何者？", "options": "①究竟覺　②隨分覺　③相似覺　④即是不覺", "answer": "④", "explanation": "相對於佛菩薩的究竟境界，凡夫雖然能止惡防非，但還沒見到不生滅的本性，所以仍屬於「**不覺**」。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "17", "question": "關於覺滅相，下列何者錯誤？", "options": "①凡夫的吾日三省吾身　②覺知滅諦之寂滅相　③此仍是在生滅心中遏捺　④若約後六麤，當覺起業相", "answer": "②", "explanation": "覺滅相是凡夫在生滅心中**止惡防非**，還未達到阿羅漢出世間「**覺知滅諦**」的寂滅境界。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "7", "question": "現在能止惡念，不被惡念繫縛，已是究竟覺。（是/否）", "options": "", "answer": "否", "explanation": "能止惡念只是修行的初步（**覺滅相**），距離徹底覺悟的「**究竟覺**」（覺生相）還有一大段距離。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "18", "question": "下列何者最能表現「覺滅相」的修行意義？", "options": "①滅除一切煩惱，永不生起　②見不生滅心而契入真如　③覺知前念滅處是惡，能止後惡不起　④念念觀空，入無分別智", "answer": "③", "explanation": "覺滅相的意義在於**察覺前一個念頭是惡的**，能立刻止住，不讓下一個惡念生起。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "9", "question": "「相似覺」之所以名為「相似」，是指二乘與初發意菩薩尚未親見真如，僅是比觀而知。（是/否）", "options": "", "answer": "是", "explanation": "相似覺意指二乘和三賢菩薩雖然理上通達，但還沒真正**親證真如**，只是「**相似**」於覺悟。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "2", "question": "法身菩薩（地上菩薩）覺於念住，遠離了分別粗念，稱為「隨分覺」。（是/否）", "options": "", "answer": "是", "explanation": "法身菩薩（登地）已能覺察到極微細的「住相」，遠離了粗重的分別念頭，**分證法身、分證真如**，破一分住相即證一分法身，這階段稱為「**隨分覺**」。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "8", "question": "生住異滅四相是心念的流轉，其中生相即是心的源頭，修行達到心源即究竟覺。（是/否）", "options": "", "answer": "否", "explanation": "生相是「從真起妄之最微細初動相」＝**無明業相**，是麤相之源，不是心源。性淨本覺、離念真心才是心源；要破除生相才能「**歸一心源**」。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "12", "question": "關於生相，以下何者正確？", "options": "①覺生相就是知初相　②知初相就是無念　③所謂的初相，其實也無有初相可知　④以上皆是", "answer": "④", "explanation": "覺生相就是覺知最初的動念（**初相**），但悟後會發現初相其實**了不可得**（本自無念），所以以上皆是。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "13", "question": "下列敘述何者錯誤？", "options": "①鵝王擇乳是譬喻菩薩修行達到十地滿心，方能遠離最微細的生相無明　②六即中分證即，對應「覺住相」，破住相無明，無明分分破，真如分分現　③覺察到微細動念初生時，了知初相即無念，是因為確實有初相無明，只是不覺而已　④四相流轉猶如睡夢，當大覺時，方知唯一淨心，四相了不可得，無有體性可辨前後", "answer": "③", "explanation": "「確實有初相無明」是錯的。覺悟後會發現初相**本無自性、了不可得**（無念），並非有一個真實的初相。"}, {"unit": "始覺四相", "unitCn": "一", "unitMeta": "單元08，18題", "qnum": "16", "question": "「菩薩地盡，滿足方便，一念相應，覺心初起，心無初相。」是指到達了什麼境界？", "options": "①十信位　②十住位　③究竟覺　④阿羅漢果", "answer": "③", "explanation": "菩薩到了十地地盡，破除最後一分**生相無明**而契入真心本源，**始本合一**，就是「**究竟覺**」。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "2", "question": "法出離鏡與智淨相、緣熏習鏡與不思議業相，在起信論中完全沒有差別，名稱不同只是重複說法。（是/否）", "options": "", "answer": "否", "explanation": "智淨相／不思議業相是就「**始覺隨染修顯**」而說，法出離鏡／緣熏習鏡是就「**性淨法體**」而說——體雖一而立義的角度不同。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "10", "question": "在「水波四喻」中，「海水」被用來譬喻無明妄識，「風」被用來譬喻真心。（是/否）", "options": "", "answer": "否", "explanation": "波水四喻中，「**海水喻真心、風喻無明**、波喻業識等」。題目將海水配無明妄識、風配真心，正好顛倒。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "12", "question": "滅相續心，是指滅相續生滅之心相，而非滅不生滅之心體。（是/否）", "options": "", "answer": "是", "explanation": "憨山大師「故可滅者，乃**轉識生滅之相**，非**不生滅之心體**也」。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "13", "question": "隨染本覺中的「智淨相」與性淨本覺中的「法出離鏡」，這兩者在「體」上有根本上的差別，完全不同。（是/否）", "options": "", "answer": "否", "explanation": "智淨相與法出離鏡「**法智雖殊，體無差別**」，僅立義角度不同。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "14", "question": "持續上大乘解行研經班，完全屬於「外熏」，與「內熏」全然無關。（是/否）", "options": "", "answer": "否", "explanation": "上大乘班兼具「**外熏**」（教法、善知識之外緣熏力）與「**內熏**」（本具覺性之內熏之力），外緣須配合內因才能起作用。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "18", "question": "有關「真如」與「無明」的關係，下列何者正確？", "options": "①真如心體隨無明而動，無明滅時心體亦隨之寂滅　②心體本來清淨不動，妄念動相只是無明所現之相，無明滅則妄相滅，而智性不壞　③無明與真如是兩種各自獨立的法，因此妄念生滅不影響心體　④只要妄念止息，真如心體便會重新生出", "answer": "②", "explanation": "論文「**心非動性，若無明滅，相續則滅，智性不壞故**」。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "19", "question": "下列何者不是「一切心識之相，皆是無明。無明之相，不離覺性，非可壞非不可壞。」所闡述的意義？", "options": "①生滅相可壞，智性不可壞　②無明與覺性體性不同，彼此對立而存在　③無明與覺性的關係，非一（相用不同）非異（體同）　④無明實性即覺性，但了無明體空，則相續心相自滅，非覺性滅", "answer": "②", "explanation": "無明依覺性而起，**不離覺性**，**非一非異、體同用異**，所以「體性不同、彼此對立」錯誤。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "20", "question": "以下何者正確？", "options": "①隨染本覺之智淨相屬修生　②性淨本覺之四鏡屬本有　③性淨本覺可以虛空喻其廣博包含，以淨鏡喻其圓明能現　④以上皆是", "answer": "④", "explanation": "智淨相屬**修生**（修顯）、四鏡屬**本有**；性淨本覺以虛空喻廣博含攝、以淨鏡喻圓明能現。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "25", "question": "有關「本覺」體用，下列何者正確？", "options": "①法出離鏡屬於「因隱」　②緣熏習鏡屬於「修顯」　③如實空鏡與因熏習鏡屬於「果顯」　④智淨相、不思議業相屬於「修顯」", "answer": "④", "explanation": "智淨相、不思議業相由始覺修證而顯，屬「**修顯**」；四鏡屬性淨本有（法出離鏡屬**果顯出纏**、緣熏習鏡屬**果顯**、如實空鏡與因熏習鏡屬**因隱在纏**）。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "29", "question": "下列何者屬於「外緣熏力」？", "options": "①上大乘班，學習佛菩薩教法　②眾生本具佛性　③內心自然生起厭離生死痛苦　④發菩提心", "answer": "①", "explanation": "上大乘班、學習佛菩薩教法，屬「**教法外緣熏力**」；②③④皆屬「**真如內熏之力**」。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "30", "question": "內心煩惱波浪滔天之時，依「水非動性，若風止滅，動相則滅，濕性不壞故」之喻，以下何者正確？", "options": "①應知妄相可滅而覺性不壞　②反正濕性「不壞」，起大煩惱，也不是壞事　③「水相風相，不相捨離」二者相依，故無明不可對治　④煩惱一現前，真心體性即被破壞", "answer": "①", "explanation": "**水喻覺性，風喻無明**。風停波息而濕性不壞，代表**妄相煩惱可滅，但真如覺性不可壞**。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "4", "question": "所謂「隨染本覺」，是依染緣對治而顯現本覺作用；染法只是顯德之緣，並非本覺變為污染。（是/否）", "options": "", "answer": "是", "explanation": "「本覺隨染」不是本覺被染。染法只是**顯發本具德相之緣**，依染緣而顯現本覺之用，體性始終清淨不失。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "9", "question": "「智淨相」是指本覺轉染還淨後，自然而有不思議作用的狀態。（是/否）", "options": "", "answer": "否", "explanation": "轉染還淨後的清淨狀態叫「**智淨相**」；自然流露度化眾生的妙用才是「**不思議業相**」。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "28", "question": "下列何者最能說明「智淨相」？", "options": "①真如本體本來清淨　②依始覺智破無明，還顯本覺清淨　③佛果之神通妙用　④內熏之因", "answer": "②", "explanation": "智淨相就是依靠**始覺智慧破除無明**，讓本來清淨的本覺（真如）重新顯露出來。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "17", "question": "關於智淨相，以下何者為非？", "options": "①還淨的熏習力量包括真如內熏之力，及所流教法外緣熏力　②登地之前，此力熏習善根　③登地已上，滅相續心相，故入偏空涅槃　④最終可破和合識相，顯現法身，智淳淨故", "answer": "③", "explanation": "智淨相是「**登地已上，行契證如**」所以能證法身、還顯本覺清淨，不是「入偏空涅槃」（偏空涅槃為**二乘**所證）。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "21", "question": "依據圓瑛法師解釋，破除和合識內一分不覺之相，根本無明窮盡，顯現「法身本覺義」，此乃哪一種果德的究竟？", "options": "①智果　②斷果　③覺果　④業果", "answer": "②", "explanation": "破除無明煩惱而顯現法身，屬於斷除煩惱障礙的「**斷果**」究竟。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "6", "question": "本覺隨染分別而生「智淨相」與「不思議業相」二種相，此二相與本覺不相捨離，因為用不離體。（是/否）", "options": "", "answer": "是", "explanation": "這兩種相都是本覺清淨體性發揮的清淨作用，既然是作用就離不開本體，所以**不相捨離**。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "5", "question": "「不思議業相」，即使未證得智淨相，憑藉一腔熱忱與度化眾生的悲願，人人都能發揮其殊勝妙用。（是/否）", "options": "", "answer": "否", "explanation": "不思議業相是**破除無明、證得智淨相後**，自然流露出來的妙用，這不是憑凡夫熱忱就能發揮的。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "7", "question": "不思議業相，是人類所成就的各種科學、工程奇蹟，如金字塔、印刷術、電腦等，難以想像故名不思議。（是/否）", "options": "", "answer": "否", "explanation": "不思議業相是本覺**轉染還淨後自然流露的利生妙用**（如觀音三十二應、隨機示現度生），不是人類科學、工程的成就。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "11", "question": "不思議業相者，以依智淨，能作一切勝妙境界，如觀音大士，三十二應、十四無畏，分身塵剎說法度生等。（是/否）", "options": "", "answer": "是", "explanation": "論文「不思議業相者，以依智淨，能作一切勝妙境界」；寶靜大師舉**觀音大士三十二應**為例。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "22", "question": "諸佛菩薩利益眾生功德之相常無斷絕，其運作機制為何？", "options": "①刻意觀察眾生業力來決定是否幫助　②隨順眾生根性，不假造作自然感應而現　③需依靠眾生不斷地供養才能持續　④需要無明妄識的推動", "answer": "②", "explanation": "佛菩薩度眾生是**隨順眾生根機自然感應**，像鏡子映物一樣任運自然，不是刻意造作。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "8", "question": "「如實空鏡」所說「遠離一切境界相」，是指覺體本來寂靜湛然，超越一切對待。（是/否）", "options": "", "answer": "是", "explanation": "妄心妄境本就虛妄不實，而覺體**空無妄染、本來寂靜湛然**、超越一切對待。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "15", "question": "性淨本覺四義中的「如實空鏡」，代表本覺體內原本含有妄染，但後來透過修行把它空除掉了。（是/否）", "options": "", "answer": "否", "explanation": "如實空鏡是指心體「**本來**」清淨，而妄心妄境本無，並不是後來修行才空除的。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "24", "question": "為什麼「如實空鏡」會強調「非覺照義」？", "options": "①因為覺性的力量太弱無法覺照　②因為修行階段還沒到，所以不能覺照　③因為妄念太強烈阻擋了覺照　④因為妄體本來就沒有（如兔角），不需要靠觀智覺照才讓它消失", "answer": "④", "explanation": "因為虛妄境界**本來沒有實體**（如兔角本空），不需要刻意用觀智去覺照才能讓它消失。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "26", "question": "所謂「一切世間境界，悉於中現，不出不入，不失不壞，常住一心」，是描述四種鏡中的哪一個？", "options": "①因熏習鏡　②如實空鏡　③法出離鏡　④緣熏習鏡", "answer": "①", "explanation": "論文因熏習鏡「一切世間境界，悉於中現，不出不入，不失不壞，常住一心」，正是此描述。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "1", "question": "因熏習鏡的「因」，可以說是此鏡能作現法因與內熏因。（是/否）", "options": "", "answer": "是", "explanation": "因有二義：一能作**現法因**，二能作**內熏因**。「因熏習鏡」之「因」兼含現法因（十法界染淨依正因果悉於一心中現）與內熏因（本具覺性熏發眾生覺悟）二義。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "27", "question": "從「因熏習鏡」的角度，一個人為何會「發心修行」？", "options": "①純屬偶然，與佛性無關　②是外力強加，非己所願　③發心後即圓滿，不必再修　④是本具佛性的內熏之力，故而厭生死苦、發心修行", "answer": "④", "explanation": "眾生**本具覺性作內熏之因**，令眾生覺悟無常、厭生死苦、發心修行。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "16", "question": "「法出離鏡」就像是磨鏡子一樣，當污垢被磨除後，鏡子散發出的光明是新產生出來的。（是/否）", "options": "", "answer": "否", "explanation": "憨山大師「**雖云離垢而光明本有，不是新生**，但一向障蔽，今始出離耳」。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "23", "question": "有關法體離障，顯性德——淳淨明，下列何者錯誤？", "options": "①「淳淨明」是修行後新生之清淨功德，原本並不具足　②破除無明覆蓋，智慧光明現前，故名「明」　③滅除麤細染心，故名「淨」　④離開真妄和合的雜相，故名「淳」", "answer": "①", "explanation": "「淳淨明」是**真心本具的性德**，因去除無明障礙而顯現，不是修行後才新生的。"}, {"unit": "本覺", "unitCn": "二", "unitMeta": "單元09–10，30題", "qnum": "3", "question": "「緣熏習鏡」是指證得法身後，諸佛菩薩能遍照眾生心，並示現種種身相來作為調伏眾生的「外熏之緣」。（是/否）", "options": "", "answer": "是", "explanation": "佛菩薩證悟後，依體起用，能隨緣示現化度眾生，作為眾生覺悟的**外緣（外熏）**。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "16", "question": "關於六麤的生起與特性，下列何者正確？", "options": "①六麤能現起三細所對的境界　②六麤由微而著，是以三細所現的境界為緣而生，麤不離細　③六麤與三細各自獨立，互不相關　④六麤先於三細而生起", "answer": "②", "explanation": "煩惱是從微細（三細）發展到粗重（六麤），粗相是**依緣細境界而生，所以粗不離細**。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "1", "question": "無明染法以「作夢」為喻：忽然睡著就像無明，夢見種種事就像三細六麤。當人醒來時，夢境的一切就頓時消散。（是/否）", "options": "", "answer": "是", "explanation": "長水子璿《筆削記》以夢喻九相：「如有一人（真如），忽然睡著（無明），作夢（業相），見（轉相）種種事（現相）……忽然覺來，上事都遣。」**迷則九相宛然，覺則當下皆空**。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "5", "question": "根本無明又稱為無始無明，是比較微細的煩惱，修行時應先破除根本無明，再破除枝末無明。（是/否）", "options": "", "answer": "否", "explanation": "惟覺安公老和尚開示「**修行先破枝末無明，枝末無明破了以後，再破根本無明**」。次第應為先枝末後根本，題目顛倒。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "13", "question": "因為一切染法皆依最初動念而生，所以修行要斷除生死苦本，關鍵就是要「離念」。（是/否）", "options": "", "answer": "是", "explanation": "憨山大師「故此結指最初一念為生死苦本，欲令行人見苦知因，要知**離念為修行之要**也」。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "22", "question": "關於三細相產生的時間先後，下列何者正確？", "options": "①先有業相，過了很久才有轉相　②境界相最先產生　③祇是一剎那心，實無前後次第　④必須經歷三大阿僧祇劫才能形成", "answer": "③", "explanation": "寶靜大師「此三相**祇是一剎那心，實無前後次第**」。三細俱時而起、本無先後。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "23", "question": "關於「無明業相」的內涵，下列敘述何者正確？", "options": "①這裡的「業」是指眾生發動身口所造作的善惡業，與六麤中的「起業相」意義完全相同　②這裡的「業」具有「動作」與「為因」兩層意義，指的是最初一念不覺使淨心生微動，且此動念為未來無邊生死苦患的起因　③在「無明業相」產生的階段，心念已經可以清楚地分辨「能見」與「所見」　④諸佛菩薩隨緣度化眾生的「本覺不思議業相」，其本質與「無明業相」是相同的，皆是因妄動而生", "answer": "②", "explanation": "圓瑛法師業有二義：**動作義**（最初一念不覺動彼淨心）、**為因義**（動則有苦、為生死苦患之因）。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "6", "question": "靜坐時萬緣放下，心念澄靜，只要心念暫一萌動，這個最初萌動的狀態就是「轉相」。（是/否）", "options": "", "answer": "否", "explanation": "最初微細萌動的狀態是「**業相**」，「**轉相**」則是進一步轉成能見的主體。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "25", "question": "為何真如原本清淨智照，會轉變為虛妄的「能見（妄見）」？", "options": "①因為一念動心失彼精了　②因為外在境界太過迷人　③因為受到他人業力的影響　④因為真如本身具有瑕疵", "answer": "①", "explanation": "因為一念無明妄動，**失去了原本清淨了然的覺性（失彼精了）**，便轉成了能見的妄見。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "21", "question": "在「境界為緣生六麤」中，眾生因為不了知境界是唯心虛妄的，便開始分別外境的「逆順好醜、愛與不愛」，這屬於哪一個階段？", "options": "①相續相　②智相　③執取相　④計名字相", "answer": "②", "explanation": "對外在境界產生好壞、愛憎的分別心，這在六麤中屬於第一步的「**智相**」。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "10", "question": "「智相」是指依於所執著的假名言相，發動身口去造作種種業。（是/否）", "options": "", "answer": "否", "explanation": "發動身口去造業的是「**起業相**」；智相只是依境起分別、愛與不愛之分別心。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "11", "question": "六麤的「智相」就是般若智慧，能如實照見諸法。（是/否）", "options": "", "answer": "否", "explanation": "智相之「智」乃**分別心**，非般若智慧。憨山大師「智即分別心也」；般若智慧是離分別、照見諸法實相之**無分別智**。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "24", "question": "下列哪一種心理狀態最符合「相續相」的定義？", "options": "①突然看到一個外在的境界　②判斷眼前的境界是順境還是逆境　③對喜歡的境界生起樂受後，念念不忘，持續回想　④開口罵人，造下口業", "answer": "③", "explanation": "相續相「依於智故，生其苦樂，覺心起念，相應不斷」，**數數起念、相續不斷**。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "4", "question": "六麤中的「相續相」，不僅代表內心對苦樂感受念念不斷，它更能「起惑潤業，引持生死」，是推動輪迴相續的關鍵動力。（是/否）", "options": "", "answer": "是", "explanation": "憨山大師「數數起念，相續不斷，**起惑潤業，引持生死**相續不斷，故名相續相」。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "2", "question": "六麤的「執取相」，是依於相續相緣念境界，於苦樂深生取著、計我我所，眾生的我執到此才明顯成形。（是/否）", "options": "", "answer": "是", "explanation": "論文「三者執取相。依於相續，緣念境界，住持苦樂，心起著故」。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "14", "question": "六麤相中的「起業相」僅單純指心理上的起心動念，尚未發動到身體與口頭的實際造作。（是/否）", "options": "", "answer": "否", "explanation": "「起業相」是指**已經發動到身體和語言去實際造作種種善惡業**了，不只是心中動念。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "17", "question": "關於染淨同異之相，以下何者正確？", "options": "①為何要辨明染淨同異之相，是因為依如來藏有生滅心，今既明生滅心，進一步明生滅即不生滅，真如生滅二門不相離　②同相者，即異而同：「覺」有「不思議業相」，「不覺」有「無明業力」，染淨二業皆非實有，名為「業幻」，皆同真如性相　③異相者，即同而異，二種幻差別的相用顯現各異：「無漏法」順平等性，由於對治染法而「隨染幻差別」；「無明」違平等性，本身自是差別，為「性染幻差別」　④以上皆是", "answer": "④", "explanation": "①辨明染淨同異之緣由、②同相即異而同（業幻皆同真如性相）、③異相即同而異（無漏隨染、無明性染）三敘俱合論文。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "7", "question": "⚠️ 《起信論》「同相」說「皆同真如性相」。所謂「性同」是從諸法的角度說，諸法同以真如為體；「相同」是從真如的角度說，真如亦以諸法為相。（是/否）", "options": "", "answer": "是", "explanation": "染淨諸法的本體都是真如（**性同**）；而真如也透過這些諸法來顯現其相（**相同**）。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "18", "question": "關於染淨的「同相」，《起信論》用「種種瓦器，皆同微塵性相」為喻。在此喻中，「淨瓶與染缸」以及「微塵」，分別對應佛法中的什麼涵義？", "options": "①淨瓶染缸喻「真如」，微塵喻「無明」　②淨瓶染缸喻「染淨業幻」，微塵喻「真如性相」　③淨瓶染缸喻「眾生」，微塵喻「業繫苦相」　④淨瓶染缸喻「六麤」，微塵喻「三細」", "answer": "②", "explanation": "瓦器（淨瓶染缸）喻**染淨業幻**，微塵喻**真如性相**（器以塵為性、塵以器為相）。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "9", "question": "關於「異相」，無漏法（淨法）是順應平等性、為對治染法而「隨染幻差別」；而無明（染法）則違背平等性，本性自然就是差別的，稱為「性染幻差別」。（是/否）", "options": "", "answer": "是", "explanation": "無漏法順平等性、為對治染法而「隨染幻差別」；無明違平等性、迷之本身自成差別而「**性染幻差別**」。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "3", "question": "「隨染幻差別」，清淨的無漏法其本性原本就充滿千差萬別，因此才能對治眾生各種不同的煩惱。（是/否）", "options": "", "answer": "否", "explanation": "無漏法本性平等無差，差別在「**隨染所顯之用**」，並非本性原本千差萬別。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "15", "question": "《起信論》說覺與不覺的種種業都叫「業幻」，圓瑛法師解釋這個「幻」字，下列何者最符合論文本義？", "options": "①覺與不覺都是虛假的存在，修行就是要把它們全部捨棄，所以稱為幻　②因為染法是無明所生帶有虛假性，所以染業稱為幻；淨業是真實的，不在幻的範圍內　③染淨二業都是真如隨緣顯現，看似有卻沒有獨立的實體，所以染淨業通通稱為幻　④「幻」是說業報虛幻不定，今生業力到下輩子不一定感果", "answer": "③", "explanation": "染法和淨法都是真心隨緣顯現的，都**沒有獨立不變的實體**，如同幻影般似有非實，所以通稱業幻。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "8", "question": "眾生所見到諸佛的報化等色相，並非真如自體的真實色相，而是隨眾生染業幻心中變現所作的。（是/否）", "options": "", "answer": "是", "explanation": "佛的法身無相，報化色相乃**隨眾生染業幻心所變現**，非真如自體之真實色相。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "19", "question": "既然真如自體是「絕相」的（亦無色相可見），為何諸佛證得菩提時，還會現出報身、化身等種種色相讓眾生看見呢？", "options": "①這是真如本來就具備的實體色相，證悟後自然顯露　②這是隨眾生染業幻心中變現所作的幻色，非本覺智色不空之性　③這是眾生的根本無明所變現的境界相（現相）　④以上皆正確", "answer": "②", "explanation": "佛的法身無相，報化色相乃**隨染業幻心所變之幻色**，非本覺智色。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "12", "question": "《起信論》引《維摩詰經》「一切眾生，即涅槃相，不復更滅」，是說涅槃是修行之後才獲得的新成就，並非眾生本來就有的。（是/否）", "options": "", "answer": "否", "explanation": "涅槃是眾生**本來就具有的清淨本性**，不是修行之後才新獲得的成就。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "20", "question": "「迷人依方故迷」是比喻什麼道理？", "options": "①眾生依覺故迷，離覺則無不覺　②眾生因為方向感不好才輪迴　③迷失的人必須尋求諸佛指引　④真覺與不覺毫無關聯", "answer": "①", "explanation": "喻**眾生依覺故迷、離覺則無不覺**。"}, {"unit": "不覺義與染淨同異之相", "unitCn": "三", "unitMeta": "單元11–12，26題", "qnum": "26", "question": "諸佛究竟菩提之法，「非可修相，非可作相，畢竟無得」，這句話的意涵是什麼？", "options": "①修行是徒勞無功的，凡夫永遠無法成佛　②佛果菩提是本來原具的，不是向外造作新求而來的　③諸佛菩提如夢幻，終究是一場空，所以無所得　④若能了達無明實性不是真如，才能獲得菩提", "answer": "②", "explanation": "「**本來原具，無修無作，即證時亦畢竟無得**」。菩提本自具足、非向外造作新求而得。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "12", "question": "有關《大乘起信論》所說「心、意、意識」，下列何者正確？", "options": "①心、意、意識三者名稱不同，實際上皆指第六意識的作用　②心指攀緣六塵之意識，意指五意，意識指阿黎耶識　③心指阿黎耶自體心，意指依不覺而展轉生起之五意（業、轉、現、智、相續），意識則依意而起，攀緣六塵，執取我、我所　④心、意、意識三者各自獨立生起，彼此無相依關係", "answer": "③", "explanation": "心＝**阿黎耶自體心**（體）；意＝依不覺展轉生起的**五意**（業轉現智相續）；意識＝依意攀緣六塵、執取我所。**一層比一層粗**。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "9", "question": "眾生生死流轉的生滅現象，完全是依據「心」、「意」、「意識」的輾轉演變而產生的。其中「心」是指阿黎耶識心體，並非起惑造業、向外攀緣的第六意識。（是/否）", "options": "", "answer": "是", "explanation": "生滅流轉是依**阿賴耶識（心）**生起微細識流（意），再發展出向外攀緣的（意識）而產生的。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "4", "question": "「五意」是指業識、轉識、現識、智識、相續識，前三意是三細，在事識中，後二意是六麤前二，也在事識中。（是/否）", "options": "", "answer": "否", "explanation": "前三意（業、轉、現）是三細，屬**本識**（黎耶識），非在事識中；後二意（智識、相續識）方為六麤前二，屬**事識中之微細分別**。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "5", "question": "依《起信論》所說，意識與五意同屬無明住地。（是/否）", "options": "", "answer": "否", "explanation": "**五意總依無明住地而生**，屬微細識流；**意識則依見愛四住地煩惱而起**，屬粗重分別。二者所依不同。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "18", "question": "依五意流轉次第，下列何者正確？", "options": "①業識（分別境）→轉識（能見）→現識（動心）→智識（念相應不斷）→相續識（執取境）　②業識（能見）→轉識（動心）→現識（執取境）→智識（念相應不斷）→相續識（分別境）　③業識（動心）→轉識（能見）→現識（境界）→智識（分別境）→相續識（念相應不斷）　④業識（執取境）→轉識（分別境）→現識（能見）→智識（動心）→相續識（現境）", "answer": "③", "explanation": "五意順序是：**業識(動心)→轉識(能見)→現識(境界)→智識(分別境)→相續識(念相應不斷)**。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "6", "question": "「心生則種種法生」，是指眾生不了真心無相，一念迷動，妄念作意、妄心生起，而生起種種妄境。（是/否）", "options": "", "answer": "是", "explanation": "這裡說的「心生」非真心生起，而是**妄心生起**。憨山大師云「以一念之迷，則萬法齊彰，故云心生則種種法生」。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "16", "question": "《起信論》云：「一切分別，即分別自心」，究其原因以下何者正確？", "options": "①心外無法，一切法皆從心起妄念而生　②眾生都喜歡反思自己　③真如本身具備各種具象的相貌可供自心分別　④第六意識只能向內觀察，無法緣外境", "answer": "①", "explanation": "**心外無法**，境界其實就是自心妄念所現，離心無境可分別，所以說「分別即分別自心」。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "17", "question": "「心生則種種法生，心滅則種種法滅」，正說明了修行者若要頓登佛地，其修證的關鍵樞紐在於什麼？", "options": "①廣學多聞，精於分別染淨　②了一念無生，觀無念　③壓抑所有的情緒，讓自己如同木石　④將現識轉化為智識", "answer": "②", "explanation": "心滅不是滅掉真心，而是**照見妄念本空、不再執取**，境界自然消失，關鍵在「**了一念無生、觀無念**」。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "2", "question": "「業識」的生起，是因為根本無明業力，導致本覺真心不覺而產生妄動所形成的。（是/否）", "options": "", "answer": "是", "explanation": "業識就是本覺真心被**根本無明業力熏動**，產生了一念不覺的微細妄動。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "13", "question": "下列敘述何者錯誤？", "options": "①一切法皆妄念作意所生，並非真心所生，因為心本不生，了無一法可得　②世間一切境界，皆依眾生無明妄心而得住持，若悟心本無相，則三界頓空　③「轉識」是由於業識返熏無明，使無明增強，原有本體的智慧光明，轉變成妄見的境界相　④「意識」以相續識為根，深深執著我愛，能起惑造業", "answer": "③", "explanation": "錯在把轉識、現識搞混了：**轉識只是產生「能見」**，「妄見的境界相（能現）」是**現識**的作用，不是轉識。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "1", "question": "「現識」所現境界，是離開心體之外，真實存在的外境。（是/否）", "options": "", "answer": "否", "explanation": "現識所現的境界，如同**病眼妄見空華**，是妄心所現的妄境，並非心外真實獨立存在的外境。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "8", "question": "「現識」能現出一切境界，如鏡現色像，任運自然的生起，並且恆常在前，但它與第六、第七識一樣，有時是會間斷、或斷滅的。（是/否）", "options": "", "answer": "否", "explanation": "法藏大師云「任運而起者，非如六七識有時斷滅」，現識**常在諸法之先、恆常現前無間斷**，不像六識易斷、七識於滅盡定等亦不現行。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "10", "question": "下列敘述何者正確？", "options": "①「業識」的產生與阿黎耶識心體無關　②「現識」常在諸法之前，是因為此識是諸法之本，諸法所依　③「智識」不了前心所現之境，虛妄無實，創起慧數，分別染淨，是事識內粗分別　④「意識」能住持過去善惡業種，成熟現在未來苦樂果報", "answer": "②", "explanation": "現識像鏡子一樣**任運現境、恆常在前**，前六識都必須依它所現的境界才有東西可攀緣，所以是**諸法的根本**。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "7", "question": "「智識」的作用，是開始對境界相產生微細的分別心，去分辨境界的染污與清淨。（是/否）", "options": "", "answer": "是", "explanation": "智識的作用就是開始對現識所現的境界，產生**染淨、好壞等微細的分別心**。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "15", "question": "在生滅因緣中，產生「智識、相續識等事識」的因與緣分別是什麼？", "options": "①阿梨耶心體為因，根本無明為緣　②梨耶返熏無明為因，境風吹動識浪為緣　③智識為因，相續識為緣　④見愛煩惱為因，客觀境界為緣", "answer": "②", "explanation": "三細形成後，**梨耶返熏無明使無明增長（因）＋境風吹動識浪（緣）**，才生出智識、相續識等六麤。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "11", "question": "哪一種識能夠讓「現在已經之事，忽然而念，未來之事，不覺妄慮」？", "options": "①轉識　②智識　③現識　④相續識", "answer": "④", "explanation": "這是「**相續識**」的作用，會讓心念不斷延續，從而回憶過去已經發生的事，或擔憂未來的事。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "3", "question": "「意識」是指第六識，又稱「分離識」或「分別事識」，它是依著「五住地無明（根本無明）」來起惑造業的。（是/否）", "options": "", "answer": "否", "explanation": "意識為第六識，亦名分離識、分別事識，是正確的。但第六意識是依著粗重的「**見愛等四住地煩惱**」來起惑造業；**五意才是總依根本無明**。"}, {"unit": "生滅因緣義", "unitCn": "四", "unitMeta": "單元13，18題", "qnum": "14", "question": "有關「意識」，下列何者正確？", "options": "①以意為根，乃意所發之識　②又稱「分離識」，外依五根取境，背覺合塵，與真心本體相背離　③能緣過去、現在、未來三世之境，及內根外塵種種事相而起分別認識，又稱「分別事識」　④以上皆是", "answer": "④", "explanation": "意識同時是「**意所發之識**」、「**分離識**」（依五根攀緣、背覺合塵）、「**分別事識**」（緣三世內外事相分別），三種說法都對。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "1", "question": "眾生因無明故，雖有其「染心」，但其心體「常恆不變」；這種「染而不染」的道理，即是所謂「不變隨緣，隨緣不變」之深義。（是/否）", "options": "", "answer": "是", "explanation": "真心本體不變卻能隨無明展現染相（**不變隨緣**）；雖現染相但清淨本體始終不變（**隨緣不變**）。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "17", "question": "「不染而染」是指真如本來清淨，卻能隨無明之緣而現起染法。（是/否）", "options": "", "answer": "是", "explanation": "「不染而染」正是指真如本來清淨不變，卻能隨著無明的緣，現起種種染污之相。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "4", "question": "「心性，常無念故，名為不變」這句話是指心體本來不隨妄念動搖，不落分別攀緣，而不是什麼都不知道。（是/否）", "options": "", "answer": "是", "explanation": "「常無念」不是什麼都不知道，而是指心體本來**不隨妄念動搖、不落分別攀緣**，這樣才叫做「不變」。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "20", "question": "「所謂心性常無念故，名為不變。既是不變，因何而有無明。」以下敘述何者正確？", "options": "①不如實知真如法一故，與真如相背，故有無明　②真如本來離念，此則無端起念，即獨頭生相，根本不覺，名為無明　③無明為染法之源，最極微細，無別有法能始乎此，亦名無始無明　④以上皆是", "answer": "④", "explanation": "三句話分別回答「為何會有無明」，三個說法都對，合起來就是完整答案。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "8", "question": "無明乃眾生迷失真如所現起的最初不覺，最極微細，更無別法能為其始，故亦名「無始無明」。（是/否）", "options": "", "answer": "是", "explanation": "無明是迷失真如所現起最初的不覺，最極微細，再沒有別的染法能作為它的起源，所以叫做「**無始無明**」。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "11", "question": "「以不達一法界故，心不相應，忽然念起，名為無明。」由此可知，無明本無實體。（是/否）", "options": "", "answer": "是", "explanation": "無明既不是真如本有，也不是離開真如另外有一個實體，只是**迷真起妄的最初不覺**而已，所以說無明本無實體。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "30", "question": "「忽然念起，名為無明」，此處的「忽然」是什麼意思？", "options": "①無明有明確的開始時間　②無明有真實自體　③無明沒有真實根源，只是一念迷妄　④無明只在凡夫身上有，菩薩完全沒有", "answer": "③", "explanation": "「忽然」不是指有一個明確的開始時間點，而是說**無明的生起找不到真實的根源**，純粹是迷真起妄的一念而已。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "5", "question": "「相應」可指心王與心所同知同緣，彼此配合而共同作用。（是/否）", "options": "", "answer": "是", "explanation": "**心王與心所同知一境、同緣一境**，彼此配合、共同作用，就稱為相應。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "13", "question": "六種染心中有相應染、不相應染二義，其不相應義者，謂心念法異，依染淨差別，而知相緣相同故。（是/否）", "options": "", "answer": "否", "explanation": "題目引的這段話是「**相應義**」的定義，並不是「不相應義」的定義，兩者講反了。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "23", "question": "下列哪三種屬於「相應染」？", "options": "①現色、能見心、根本業　②執相應、不斷相應、分別智相應　③業識、轉識、現識　④真如、無明、染心", "answer": "②", "explanation": "六染心分兩類：前三種（執相應、不斷相應、分別智相應）因為**有能所對待、心境交涉**，屬於「相應染」；後三種屬於「不相應染」。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "16", "question": "後三種染心屬於「不相應染」，是因為它們都是一念不覺所現起的微細妄相，此時尚未分出心王與心所的差別對待。（是/否）", "options": "", "answer": "是", "explanation": "後三種染心（現色、能見心、根本業不相應染）都只是**一念不覺所現起的微細心相**，這時候還沒有分出心王與心所的差別對待。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "26", "question": "「不相應染」之所以稱為不相應，主要是因為：", "options": "①與修行完全無關　②心王與心所互相衝突　③即心不覺，尚未分出心王心所及明顯外境相應　④只屬於二乘人", "answer": "③", "explanation": "後三種不相應染都只是一念不覺所現的微細心相，這時候**心王與心所還沒有分開**，也沒有明顯的外境可以相應。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "6", "question": "染心因妄取境界、違背真如平等性，所以名為煩惱礙。（是/否）", "options": "", "answer": "是", "explanation": "因為染心會**妄取境界、違背真如平等之性**，障礙眾生體悟真如、顯發根本智，所以名為煩惱礙。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "7", "question": "染心義者，名為煩惱礙，能障世間自然業智；無明義者，名為智礙，能障真如根本智。（是/否）", "options": "", "answer": "否", "explanation": "講義原文是「染心義者，名為**煩惱礙，能障真如根本智**」、「無明義者，名為**智礙，能障世間自然業智**」，題目把兩者所障礙的對象講反了。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "25", "question": "《起信論》所謂「智礙」，以下敘述何者正確？", "options": "①依我執見思，能使流轉，障涅槃果，名煩惱障，是菩薩別障　②依法執等惑，迷所知境，障菩提果，名所知障，是二乘通障　③能起染心之無明，昏迷不覺，為智礙，亦名所知障，所知非障，障所知智境故　④以上皆是", "answer": "③", "explanation": "《起信論》的「智礙」指的是**無明本身昏迷不覺**，障礙了如實照見一切差別境界的自然業智，也就是唯識所說的「**所知障**」。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "10", "question": "六種染心，即意識及五種意。依因緣生起次第，從麤至細；辨治斷次第，從細向麤。（是/否）", "options": "", "answer": "否", "explanation": "順序講反了：講迷真起妄的次第是「**從細至麤**」（由業識到意識）；講對治斷惑的次第才是「**從麤向細**」（由執相應染斷到根本業不相應染）。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "15", "question": "馬鳴菩薩於《大乘起信論》中，循循善誘從「三細六粗」、「五意」、「六染」等方面說明無明煩惱生起的過程，目的在鍛鍊眾生的邏輯推理能力，因為邏輯推理能力是成佛的不二法門。（是/否）", "options": "", "answer": "否", "explanation": "馬鳴菩薩說明的用意，是要幫助眾生**看清煩惱如何生起，進而觀照返妄歸真、對治無明**，不是為了訓練邏輯推理能力。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "21", "question": "「緣起之體、緣起之緣由、緣起之相」分別可對應：", "options": "①染心、真如、無明　②真如、無明、染心　③無明、染心、真如　④真如、染心、無明", "answer": "②", "explanation": "「緣起之體」＝**真如**（生滅所依的本體）；「緣起緣由」＝**無明**（不覺心動的緣由）；「緣起之相」＝**染心**（無明熏動真心後所現的生滅相狀）。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "12", "question": "「是心從本已來，自性清淨而有無明，為無明所染，有其染心；雖有染心，而常恆不變。」此「不變隨緣，隨緣不變」之義，唯佛乃能盡知。（是/否）", "options": "", "answer": "是", "explanation": "這種道理極其深奧，**唯有佛才能完全了知**。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "24", "question": "為何無明熏習所起識唯佛能了？以下何者正確？", "options": "①以清淨心中，本來無染，因無明故，有其染心，此不染而染，難可了知，故唯佛能了　②雖有染心，而心體清淨，常恆不變，此染而不染，難可了知，故唯佛能了　③此甚深微細，故非三賢十聖可及，故唯佛能了耳　④以上皆是", "answer": "④", "explanation": "三點合起來就是完整答案：**不染而染、染而不染、甚深微細非三賢十聖可及**。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "18", "question": "身為佛門入世弟子，吾人於日常生活中如何實踐「染而不染」？", "options": "①但自無心於萬物，何妨萬物常圍遶　②不求立刻斷除情緒，而是要一次又一次地練習知而不著，提升作主能力　③善用同事攝度化眾生，起般若觀照，度而無度　④以上皆是", "answer": "④", "explanation": "實踐染而不染，要在生活中**練習知而不著、提升作主能力**，並用般若智慧**度眾而不著相**。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "28", "question": "對六種染心中執相應染的敘述何者正確？", "options": "①是六麤中執取相及計名字相　②由其執著心外有法，與境相應，染污自性，故云執相應染　③依二乘解脫，及信相應地遠離　④以上皆是", "answer": "④", "explanation": "執相應染就是六麤中的執取相、計名字相，因為**執著心外實有境界、與境相應而染污自性**，要到二乘無學位或初住（信相應地）才能遠離。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "22", "question": "下列何者對「菩薩三賢位」的理解是正確的？", "options": "①已究竟斷盡無明　②只隨妄念流轉，完全不知緣起　③依教觀察真如緣起，尚未親證真如　④已入如來地", "answer": "③", "explanation": "三賢位（十住、十行、十迴向）的菩薩是依著佛陀言教推求體會（比量觀察），屬於「**相似覺**」，還沒有真正親證真如。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "29", "question": "六種染心中之「不斷相應染」，以下陳述何者不正確？", "options": "①即五意中相續識、六麤中相續相　②念佛達到念念相續不斷，即能究竟離　③依三賢位中修學，能漸漸捨離　④依法執，相續不斷得名", "answer": "②", "explanation": "不斷相應染要靠三賢位依教修觀、漸漸捨離法執，到**初地「淨心地」**才能究竟遠離，不是靠「念佛念念相續」就能斷除。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "27", "question": "菩薩在第九地「心自在地」能遠離下列哪一種微細染心？", "options": "①能見心不相應染　②不斷相應染　③執相應染　④現色不相應染", "answer": "①", "explanation": "能見心不相應染對應五意中的「**轉識**」、三細中的「**能見相**」，要到第九地「**心自在地**」才能遠離。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "14", "question": "「能見心不相應染」對應三細中的能見相（轉識），這必須要到如來果地才能夠究竟遠離。（是/否）", "options": "", "answer": "否", "explanation": "「能見心不相應染」是在**第九地（心自在地）**就能遠離，不需要等到如來果地；要到如來果地才能離的是「**根本業不相應染**」。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "9", "question": "六種染心中的「根本業不相應染」，即五意中的業識、三細中的業相。（是/否）", "options": "", "answer": "是", "explanation": "「根本業不相應染」對應五意中的**業識**、三細中的**業相**，這是最微細的一念妄動，屬於生滅流轉的根源。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "2", "question": "二乘人雖已斷見思惑、證得人空，但因尚未了達根本無明，故對由無明所起的微細業識，仍無法真正了知。（是/否）", "options": "", "answer": "是", "explanation": "二乘雖斷見思、證人空，但因為**沒有了達根本無明**，對由無明所生起的微細業識，還是不能真正了知。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "3", "question": "依根本無明所起的業識，最極微細，凡夫、二乘無法了知，唯地上菩薩能窮了。（是/否）", "options": "", "answer": "否", "explanation": "講義說「**唯佛窮了**」，連十地菩薩都「不能知盡」，並不是地上菩薩就能窮了，只有佛才能徹底窮盡業識根源。"}, {"unit": "六染心與無明", "unitCn": "五", "unitMeta": "單元14–15，30題", "qnum": "19", "question": "關於「根本業不相應染」與「無明」治斷的時序，下列敘述何者正確？", "options": "①業識滅與無明惑盡，然兩者治斷並非一時　②無明先斷，隨後業識才在如來地滅除　③業識滅時，無明即斷，無明盡時，識不和合，同在如來地盡　④業識在十地滿心斷，無明則要到佛果地才斷", "answer": "③", "explanation": "根本無明是迷、業識是因無明而起的最初妄動，**業識滅、無明也跟著斷，兩者同時在如來地究竟斷盡**，沒有誰先誰後。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "單元16，11題", "qnum": "2", "question": "論云：「此二種生滅……若因滅，則緣滅。」是指在修證上只要對治了根本無明，則六染心皆滅。（是/否）", "options": "", "answer": "是", "explanation": "根本無明（因）一旦對治斷除，境界（緣）就會跟著滅，**三細、三麤六種染心也就全部隨之而滅**。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "單元16，11題", "qnum": "3", "question": "起信論云：「所言滅者，唯心相滅，非心體滅。」論中所言滅者，但境界緣、無明因滅時，麤細染心之相滅，非因緣滅時，六染心體俱滅也。（是/否）", "options": "", "answer": "是", "explanation": "所謂「滅」，滅的是境界緣、無明因滅時，麤細染心之「**相**」滅了，並不是六染心的「**體**」也一起滅掉。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "單元16，11題", "qnum": "7", "question": "當「無明」與「境界」等生滅因緣滅去時，究竟是什麼被滅了？", "options": "①眾生本具的真如心體　②麤細染心之相　③能證得佛果的佛性　④六種染心之體", "answer": "②", "explanation": "因緣滅去時，滅的只是染心所顯現的「**相**」，不是眾生本具的真如心體，也不是佛性，更不是六染心的「體」。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "單元16，11題", "qnum": "4", "question": "心生滅相之所以有麤、有細，乃因無明惑染之厚薄，以顯其相，心本無相。（是/否）", "options": "", "answer": "是", "explanation": "心本來**無相**，是因為麤細無明惑染輕重不同，才顯現出種種生滅之相。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "單元16，11題", "qnum": "9", "question": "關於「真如心體」與「生滅相」的關係，下列敘述何者正確？", "options": "①心的本體原本就具備種種生滅相貌，只是等待因緣顯現出來　②真如之體會隨著外在的染淨因緣發生改變，因此無法始終不變　③心本來無相，是因為遇上麤細無明惑染或外在的染淨因緣，才顯現出種種生滅相　④生滅因緣只會顯現出清淨的相貌，不會顯現出染污的相貌", "answer": "③", "explanation": "真如心體本自無相，只因**無明惑染有厚有薄**，才顯現粗細不同的生滅之相，而真如的**體性不變**。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "單元16，11題", "qnum": "5", "question": "「這念心雖然有生滅因緣之用……真如自體始終存在、不變。」這是指佛的境界，若是眾生境界則真如自體會隨境界而變。（是/否）", "options": "", "answer": "否", "explanation": "「真如之體始終存在、不變」的道理，**適用於一切眾生**，不是只限佛的境界。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "單元16，11題", "qnum": "6", "question": "關於眾生心念的「生滅相」，下列對於「前三染」的敘述何者正確？", "options": "①屬於「與心不相應」的細相　②在經典中被稱為「流注生滅」　③具有心王心所相隨、心境對立的特徵，相貌麤顯　④其體非常微細，像暗流般恆流不絕", "answer": "③", "explanation": "前三染（執相應、不斷相應、分別智相應染）屬「相應染」，心王心所相隨、能所對待明顯，相貌粗顯，稱為「**相生滅**」；後三染才是與心不相應的細相，稱為「**流注生滅**」。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "單元16，11題", "qnum": "8", "question": "心生滅相有麤、細二種，以下敘述何者正確？", "options": "①此二種生滅，皆依枝末無明熏習真如，動起三細，轉起麤心　②就六染言，前三相應染細，後三不相應染麤　③根本業不相應染，乃細中之細，佛果上能離，故云唯佛能知　④以上皆是", "answer": "③", "explanation": "①錯在說是「枝末無明」，其實是「**根本無明**」；②錯把相應染、不相應染的麤細講反了；③正確：**根本不相應染最細，只有佛果位才能究竟遠離**。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "單元16，11題", "qnum": "1", "question": "「根本業不相應染」屬於六種染心中的「細中之粗」，只要修行到了初地以上的「地上菩薩」階位，就能夠完全覺察並將其斷除。（是/否）", "options": "", "answer": "否", "explanation": "根本業不相應染是「**細中之細**」，不是細中之粗；而且要到**十地金剛喻定後心、果地（佛地）**才能斷除。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "單元16，11題", "qnum": "10", "question": "關於「麤中之麤，凡夫境界。麤中之細及細中之麤，菩薩境界。細中之細，是佛境界。」下列何者正確？", "options": "①禪七期間坐到好香，此為麤中之細的境界　②不斷相應染，分別智相應染，乃細中之麤　③粗與細的差別，是由於去妄的程度不同而有，非這念心實有粗細之相　④念佛達到一心不亂，此為細中之麤的境界", "answer": "③", "explanation": "**粗細只是依斷惑深淺所立的假名方便**，這念心本身並沒有一個固定不變的粗相或細相。"}, {"unit": "釋生滅相", "unitCn": "六", "unitMeta": "單元16，11題", "qnum": "11", "question": "「麤中之麤，凡夫境界」，以下敘述何者正確？", "options": "①一不如意，就瞋心大作　②靜坐時妄想、昏沉不斷　③仔細盤算，算計他人　④以上皆是", "answer": "④", "explanation": "一不如意就瞋心大作、靜坐時妄想昏沉不斷、仔細盤算計較他人，這些都是凡夫最容易察覺、**最粗重的煩惱現行**，正是「麤中之麤，凡夫境界」的寫照。"}]</script>
<script>
const ALL = JSON.parse(document.getElementById('qdata').textContent);
const BM_KEY = 'aqe_qishinlun_bookmarks_v2';
const STATE_KEY = 'aqe_flashcard_state';

function getBookmarks() {
  try { return new Set(JSON.parse(localStorage.getItem(BM_KEY) || '[]')); }
  catch(e) { return new Set(); }
}
function saveBookmarks(set) {
  localStorage.setItem(BM_KEY, JSON.stringify(Array.from(set)));
}
let bookmarks = getBookmarks();

function qid(item) { return item.unitCn + '-Q' + item.qnum; }

// populate unit select
const units = [];
ALL.forEach(item => { if (!units.includes(item.unit)) units.push(item.unit); });
const unitSelect = document.getElementById('unitSelect');
unitSelect.innerHTML = '<option value="__all__">全部單元（' + ALL.length + '題）</option>' +
  units.map(u => {
    const count = ALL.filter(i => i.unit === u).length;
    return `<option value="${u}">${u}（${count}題）</option>`;
  }).join('');

let deck = [];
let order = [];
let pos = 0;
let flipped = false;
let shuffleOn = false;
let starOnlyOn = false;

function buildDeck() {
  const unitVal = unitSelect.value;
  let base = unitVal === '__all__' ? ALL.slice() : ALL.filter(i => i.unit === unitVal);
  if (starOnlyOn) {
    base = base.filter(i => bookmarks.has(qid(i)));
  }
  deck = base;
  order = deck.map((_, i) => i);
  if (shuffleOn) shuffleArray(order);
  pos = 0;
  flipped = false;
  render();
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function current() {
  if (deck.length === 0) return null;
  return deck[order[pos]];
}

function render() {
  const stage = document.getElementById('stage');
  const card = document.getElementById('flipCard');
  const item = current();

  if (!item) {
    stage.innerHTML = '<div class="empty-state">這個篩選條件下沒有題目。<br>' +
      (starOnlyOn ? '你還沒有加星號的題目喔，先去「全部單元」點幾個 ★ 吧。' : '') + '</div>';
    document.getElementById('progressText').textContent = '0 / 0';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('prevBtn').classList.add('disabled');
    document.getElementById('nextBtn').classList.add('disabled');
    return;
  }

  card.classList.toggle('flipped', flipped);

  const tag = item.unit + '・' + item.unitMeta.split('，')[0];
  document.getElementById('tagFront').textContent = tag;
  document.getElementById('tagBack').textContent = tag;
  document.getElementById('qnumFront').textContent = 'Q' + item.qnum;
  document.getElementById('questionText').textContent = item.question;
  document.getElementById('optionsText').textContent = item.options || '';
  document.getElementById('optionsText').style.display = item.options ? 'block' : 'none';

  const av = document.getElementById('answerValue');
  av.textContent = item.answer;
  av.className = 'answer-value ' + (item.answer === '是' ? 'yes' : item.answer === '否' ? 'no' : 'pick');

  document.getElementById('explanationText').innerHTML = mdBold(item.explanation);

  const isStar = bookmarks.has(qid(item));
  document.getElementById('starFront').textContent = isStar ? '★' : '☆';
  document.getElementById('starFront').classList.toggle('on', isStar);
  document.getElementById('starBack').textContent = isStar ? '★' : '☆';
  document.getElementById('starBack').classList.toggle('on', isStar);

  document.getElementById('progressText').textContent = (pos + 1) + ' / ' + deck.length;
  document.getElementById('progressFill').style.width = ((pos + 1) / deck.length * 100) + '%';
  document.getElementById('prevBtn').classList.toggle('disabled', pos === 0);
  document.getElementById('nextBtn').classList.toggle('disabled', pos === deck.length - 1);

  saveState();
}

function mdBold(s) {
  return (s || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function handleCardClick(e) {
  flipCard();
}
function flipCard() {
  if (!current()) return;
  flipped = !flipped;
  document.getElementById('flipCard').classList.toggle('flipped', flipped);
}
function goNext() {
  if (pos < deck.length - 1) { pos++; flipped = false; render(); }
}
function goPrev() {
  if (pos > 0) { pos--; flipped = false; render(); }
}
function toggleStar(e) {
  e.stopPropagation();
  const item = current();
  if (!item) return;
  const id = qid(item);
  if (bookmarks.has(id)) bookmarks.delete(id);
  else bookmarks.add(id);
  saveBookmarks(bookmarks);
  render();
}
function toggleShuffle() {
  shuffleOn = !shuffleOn;
  document.getElementById('shuffleBtn').classList.toggle('active', shuffleOn);
  order = deck.map((_, i) => i);
  if (shuffleOn) shuffleArray(order);
  pos = 0; flipped = false;
  render();
}
function toggleStarOnly() {
  starOnlyOn = !starOnlyOn;
  document.getElementById('starOnlyBtn').classList.toggle('active', starOnlyOn);
  buildDeck();
}
function onUnitChange() {
  buildDeck();
}

function saveState() {
  const item = current();
  if (!item) return;
  localStorage.setItem(STATE_KEY, JSON.stringify({
    unit: unitSelect.value, shuffleOn, starOnlyOn, qid: qid(item)
  }));
}
function restoreState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null');
    if (!s) return;
    if (units.includes(s.unit)) unitSelect.value = s.unit;
    shuffleOn = !!s.shuffleOn;
    starOnlyOn = !!s.starOnlyOn;
    document.getElementById('shuffleBtn').classList.toggle('active', shuffleOn);
    document.getElementById('starOnlyBtn').classList.toggle('active', starOnlyOn);
  } catch(e) {}
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goNext();
  else if (e.key === 'ArrowLeft') goPrev();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  else if (e.key.toLowerCase() === 's') toggleStar(e);
});

restoreState();
buildDeck();
</script>
</body>
</html>
